<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>016 mockup 3 · Spans</title>
<style>
/*CORE_CSS*/
/* ---- variant 3: time is the main axis; every call, tool and effect sits where it happened ---- */
.layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); }
.rail { position: sticky; top: 45px; align-self: start; max-height: calc(100vh - 45px); overflow: auto; padding: 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.rail h2 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ritem { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
.ritem:hover, .ritem[aria-current=true] { background: var(--panel); border-color: var(--border); }
.ritem .p { color: var(--hi); font-size: 12.5px; }
.ritem .m { font-size: 11px; color: var(--muted); }
.ritem .err { color: var(--bad); font-weight: 600; }
main { padding: 14px 20px 60px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
/* session overview: the whole session on one axis */
.ov { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ov h2 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ovtrack { position: relative; height: 30px; background: repeating-linear-gradient(135deg, var(--panel) 0 4px, var(--bg) 4px 8px); border-radius: 4px; border: 1px solid var(--line); }
.ovseg { position: absolute; top: 2px; bottom: 2px; min-width: 14px; border: 0; border-radius: 3px; background: var(--model-bg); outline: 1px solid var(--model); color: var(--hi); font-size: 11px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.ovseg .tl { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tool-bg); outline: 1px solid var(--toolc); }
.ovseg span { position: relative; }
.ovseg[aria-current=true] { outline: 2px solid var(--hi); }
.ovmark { position: absolute; top: -2px; font-size: 13px; transform: translateX(-50%); color: var(--warn); }
.ovaxis { position: relative; height: 14px; font-size: 11px; color: var(--muted); }
.ovaxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend .sw { display: inline-block; width: 18px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
/* one turn */
.turn { border: 1px solid var(--border); border-radius: 8px; scroll-margin-top: 60px; }
.turn[aria-current=true] { border-color: var(--accent); }
.th { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 8px 12px; background: var(--panel); font-size: 12px; color: var(--muted); border-radius: 8px 8px 0 0; }
.th .tn { font-weight: 600; font-size: 13px; }
.th .cnt { margin-left: auto; color: var(--text); }
.split { display: inline-flex; height: 8px; width: 120px; border-radius: 2px; overflow: hidden; background: var(--line); vertical-align: middle; }
.split i { display: block; }
.prompt { padding: 6px 12px 8px; color: var(--hi); border-bottom: 1px solid var(--line); }
.g { display: grid; grid-template-columns: minmax(16rem, 26rem) minmax(0, 1fr); font-size: 12.5px; }
.g > div { min-width: 0; }
.lab { padding: 2px 10px; border-right: 1px solid var(--line); display: flex; align-items: baseline; gap: 6px; }
.lab button { all: unset; cursor: pointer; display: flex; gap: 6px; align-items: baseline; min-width: 0; width: 100%; }
.lab button:focus-visible { outline: 2px solid var(--accent); }
.lab button:hover .arg, .lab button:hover .nm { text-decoration: underline; }
.lab .nm { color: var(--hi); font-weight: 600; }
.lab .arg { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.lab .tm { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.lab.d1 { padding-left: 26px; } .lab.d2 { padding-left: 42px; } .lab.d3 { padding-left: 58px; }
.trk { position: relative; height: 22px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; }
.bar { position: absolute; top: 5px; height: 12px; min-width: 3px; border-radius: 2px; background: var(--toolc); }
.bar.failed { background: repeating-linear-gradient(45deg, var(--bad) 0 3px, transparent 3px 6px); outline: 1px solid var(--bad); }
.cbar { all: unset; position: absolute; top: 3px; height: 16px; min-width: 4px; border-radius: 2px; background: var(--model-bg); outline: 1px solid var(--model); color: var(--hi); font-size: 10.5px; line-height: 16px; text-align: center; overflow: hidden; cursor: pointer; white-space: nowrap; }
.cbar:focus-visible { outline: 2px solid var(--accent); }
.cbar.think { background: repeating-linear-gradient(90deg, var(--model-bg) 0 6px, var(--panel2) 6px 8px); }
.mk { position: absolute; top: 2px; transform: translateX(-50%); font-size: 13px; line-height: 18px; color: var(--hi); }
.lane .lab { color: var(--muted); }
.rowsep > div { border-top: 1px solid var(--line); }
.grp { grid-column: 1 / -1; padding: 3px 10px; font-size: 12px; color: var(--muted); font-style: italic; border-top: 1px solid var(--line); }
.trk.axis { background: none; height: 16px; font-size: 11px; color: var(--muted); }
.trk.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.trk.axis span:first-child { transform: none; }
.trk.axis span:last-child { transform: translateX(-100%); }
.ans { padding: 6px 12px 8px; border-top: 1px solid var(--line); font-size: 13px; display: flex; gap: 10px; }
.ans .who { color: var(--muted); font-size: 12px; flex: none; }
.agent { font-size: 11px; color: var(--toolc); border: 1px solid var(--toolc); border-radius: 4px; padding: 0 4px; }
.idle { text-align: center; font-size: 12px; color: var(--muted); margin: -8px 0; }
.between { border: 1px dashed var(--warn); border-radius: 8px; }
.between p { margin: 0; padding: 6px 12px; font-size: 12px; color: var(--muted); }
/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(36rem, 100%); background: var(--panel); border-left: 1px solid var(--border); z-index: 31; overflow: auto; box-shadow: -16px 0 40px #0006; }
.dclose { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 18px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); z-index: 1; }
.dclose button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .rail { position: static; max-height: none; border-right: 0; flex-direction: row; overflow-x: auto; }
  .ritem { min-width: 13rem; }
  .g { grid-template-columns: minmax(11rem, 45%) minmax(0, 1fr); }
}
</style>
</head>
<body>
<div id="top"></div>
<div class="layout">
  <nav class="rail" aria-label="Turns" id="rail"></nav>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" hidden tabindex="-1"><div class="dclose"><span id="dpos">details</span><button type="button" id="dclose">Close <kbd>Esc</kbd></button></div><div id="dbody"></div></aside>
<script>/*CORE_JS*/</script>
<script>
"use strict";
const { S, turns, esc, dur, clock, plural } = G;
document.getElementById("top").innerHTML = G.topbar("mockup 3 · spans");

document.getElementById("rail").innerHTML = `<h2>Turns</h2>` + turns.map((t) => {
  const fails = t.tools.filter((x) => !x.ok).length;
  return `<button type="button" class="ritem" data-turn="${t.n}" title="${esc(t.prompt)}"><span class="p clamp">${t.n}. ${esc(t.prompt)}</span><span class="m">${esc(G.railMeta(t))}${fails ? ` · <span class="err">✗ ${fails} failed</span>` : ""}</span></button>`;
}).join("");

// ---- overview: whole session, turns as segments, idle between them hatched ----
function overview() {
  const a = S.side[0].at, b = S.end, W = b - a;
  const x = (s) => ((s - a) / W) * 100;
  const segs = turns.map((t) => {
    const tt = G.turnTime(t);
    const tl = tt.clock ? (tt.tool / tt.clock) * 100 : 0;
    return `<button type="button" class="ovseg" data-turn="${t.n}" style="left:${x(t.at)}%;width:${x(t.end) - x(t.at)}%" title="Turn ${t.n} · ${clock(t.at)} · ${esc(G.turnTimeText(t))}" aria-label="Turn ${t.n}, ${esc(G.turnTimeText(t))}"><i class="tl" style="width:${tl}%"></i><span>${t.n}</span></button>`;
  }).join("");
  const marks = S.between.flatMap((bt) => bt.effects.map((e) => `<span class="ovmark" style="left:${x(e.at)}%" title="○ outside any tool call · ${esc(e.path)} ${esc(e.change)} at ${clock(e.at)}" aria-label="your edit, ${esc(e.path)}">○</span>`)).join("");
  const ticks = [0, .25, .5, .75, 1].map((f) => `<span style="left:${f * 100}%">${clock(a + f * W, false)}</span>`).join("");
  const st = G.sessionTime();
  return `<section class="ov" aria-label="Session overview"><h2>Session · ${dur(st.clock)} wall clock · ${dur(st.model)} model · ${dur(st.tool)} tools · hatched = idle between turns</h2><div class="ovtrack">${segs}${marks}</div><div class="ovaxis">${ticks}</div>
  <p class="legend"><span><i class="sw" style="background:var(--model-bg);outline:1px solid var(--model)"></i>model call</span><span><i class="sw" style="background:var(--toolc)"></i>tool call</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--bad) 0 3px,transparent 3px 6px);outline:1px solid var(--bad)"></i>✗ failed tool</span><span><i class="sw" style="background:repeating-linear-gradient(90deg,var(--model-bg) 0 6px,var(--panel2) 6px 8px);outline:1px solid var(--model)"></i>call with thinking</span><span>effect marker = its label glyph:</span>${Object.keys(G.LABELS).map((k) => G.labelBadge({ label: k })).join("")}</p></section>`;
}

// ---- one turn as a span chart ----
function turnChart(t) {
  const A = t.at, W = Math.max(t.end - t.at, 0.5);
  const x = (s) => Math.max(0, Math.min(100, ((s - A) / W) * 100));
  const w = (d) => Math.max(0, (d / W) * 100);
  const out = [];
  out.push(`<div class="lab muted small">+ seconds from the prompt</div><div class="trk axis" aria-hidden="true">${[0, .25, .5, .75, 1].map((f) => `<span style="left:${f * 100}%">+${dur(f * W)}</span>`).join("")}</div>`);
  // model lanes: one per thread
  const lanes = [["main thread", t.calls.filter((c) => !c.agent)], ...[...new Set(t.calls.filter((c) => c.agent).map((c) => c.agent))].map((a) => [`sub-agent ${a}`, t.calls.filter((c) => c.agent === a)])];
  for (const [name, cs] of lanes) {
    if (!cs.length) continue;
    out.push(`<div class="lab lane rowsep" style="border-top:1px solid var(--line)"><span class="muted">◆ model · ${esc(name)}</span><span class="tm">${plural(cs.length, "call")}</span></div><div class="trk" style="border-top:1px solid var(--line)">${cs.map((c) => `<button type="button" class="cbar${c.thinking ? " think" : ""}" data-open="call:${c.n}" style="left:${x(c.at)}%;width:${w(c.dur)}%" title="#${c.n} · ${dur(c.dur)}${c.thinking ? " · has thinking" : ""}" aria-label="model call #${c.n}, ${dur(c.dur)}${c.thinking ? ", has thinking" : ""}">${w(c.dur) > 4 ? `#${c.n}` : ""}</button>`).join("")}</div>`);
  }
  for (const it of G.walk(t)) {
    if (it.type === "tool") {
      const x0 = it.t, s = G.STATUS(x0);
      out.push(`<div class="lab d${it.depth}" style="border-top:1px solid var(--line)"><button type="button" data-open="tool:${x0.id}"><span class="st st-${s.w}">${s.g}${x0.ok ? "" : " failed"}</span><span class="nm">${esc(x0.name)}</span>${x0.agent ? `<span class="agent">${esc(x0.agent)}</span>` : ""}<span class="arg" title="${esc(G.toolArg(x0))}">${esc(G.toolArg(x0))}${G.lineStat(x0) ? ` ${G.lineStat(x0)}` : ""}</span><span class="tm">${esc(G.toolNo(x0))} · ${dur(x0.dur)}</span></button></div><div class="trk" style="border-top:1px solid var(--line)"><span class="bar${x0.ok ? "" : " failed"}" style="left:${x(x0.at)}%;width:${w(x0.dur)}%" title="${esc(x0.name)} ${clock(x0.at)}–${clock(x0.at + x0.dur)}"></span></div>`);
    } else if (it.type === "effect") {
      const e = it.e, wh = G.effectWhat(e);
      out.push(`<div class="lab d${it.depth + 1}"><button type="button" data-open="effect:${e.id}">${G.labelBadge(e)}<span class="arg" title="${esc(e.kind === "net" ? "" : G.full(e.path))}">${wh.g} ${esc(G.effectTarget(e))}</span><span class="tm">${esc(e.kind === "net" ? dur(e.dur) : e.kind === "read" ? "read" : (e.add != null ? `+${e.add} −${e.del}` : G.bytes(e.size)))}</span></button></div><div class="trk"><span class="mk" style="left:${x(e.at)}%" title="${esc(G.LABELS[e.label].w)} · ${clock(e.at)}">${G.LABELS[e.label].g}</span>${e.kind === "net" ? `<span class="bar" style="left:${x(e.at)}%;width:${w(e.dur)}%;top:9px;height:4px;background:var(--muted)"></span>` : ""}</div>`);
    } else if (it.type === "group") {
      out.push(`<div class="grp">${it.kind === "several" ? "◌" : "○"} ${esc(it.title)}</div>`);
    } else if (it.type === "note") {
      out.push(`<div class="grp">${esc(it.text)} · tools seen by hooks only</div>`);
    }
  }
  return `<div class="g" role="group" aria-label="Turn ${t.n} spans">${out.join("")}</div>`;
}
function splitBar(t) {
  const tt = G.turnTime(t);
  if (!tt.clock || t.hooksOnly) return "";
  return `<span class="split" aria-hidden="true"><i style="width:${tt.model / tt.clock * 100}%;background:var(--model)"></i><i style="width:${tt.tool / tt.clock * 100}%;background:var(--toolc)"></i></span>`;
}
const main = document.getElementById("main");
let html = `<section class="shead" aria-label="Session"><h1>${esc(S.title)}</h1>${G.sessionMeta()}${G.headerFacts(true)}<div>${G.sideToggle()}</div>${G.unassignedNote()}</section>${overview()}`;
turns.forEach((t, i) => {
  if (i > 0) html += `<p class="idle">⋯ ${dur(t.at - turns[i - 1].end)} idle ⋯</p>`;
  html += `<section class="turn" id="turn-${t.n}"><div class="th"><button type="button" class="linkish tn" data-open="turn:${t.n}">Turn ${t.n}</button><span>${clock(t.at)}</span><span>${esc(G.turnTimeText(t))}</span>${splitBar(t)}<span class="cnt">${plural(t.tools.length, "tool call")} · ${esc(G.countsText(G.counts(t.effects)))}</span></div><div class="prompt">${esc(t.prompt)}</div>${turnChart(t)}${t.answer ? `<div class="ans"><span class="who">answer</span><span class="clamp clamp2">${esc(t.answer)}</span></div>` : ""}</section>`;
  const b = S.between.find((x) => x.after === t.n);
  if (b) html += `<section class="between" aria-label="Between turns"><p>Between turns ${t.n} and ${t.n + 1}, ${clock(b.effects[0].at)}: no tool call was running</p><ul class="elist" style="padding:0 12px 8px">${b.effects.map((e) => `<li><span class="elbl">${G.labelBadge(e)}</span><button type="button" class="linkish" data-open="effect:${e.id}">${G.effectWhat(e).g} ${esc(e.change)} <code title="${esc(G.full(e.path))}">${esc(e.path)}</code></button><span class="muted">${esc(G.effectStat(e))}</span></li>`).join("")}</ul></section>`;
});
main.innerHTML = html;

// ---- drawer ----
const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
let opener = null;
function openDrawer(key, from) {
  opener = from;
  const [k, id] = key.split(":");
  document.getElementById("dbody").innerHTML = G.detail(k, id);
  document.getElementById("dpos").textContent = `${k === "call" ? "model call" : k} details`;
  drawer.hidden = scrim.hidden = false;
  drawer.focus();
}
function closeDrawer() { drawer.hidden = scrim.hidden = true; if (opener && opener.isConnected) opener.focus(); }
document.getElementById("dclose").addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);
document.body.addEventListener("click", (ev) => {
  const o = ev.target.closest("[data-open]");
  if (o && !o.closest(".drawer")) { openDrawer(o.dataset.open, o); return; }
  const r = ev.target.closest("[data-turn]");
  if (r) go(+r.dataset.turn);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !drawer.hidden) closeDrawer();
  if (drawer.hidden && (ev.key === "j" || ev.key === "k")) go(cur + (ev.key === "j" ? 1 : -1));
});
let cur = 1;
function go(n, scroll = true) {
  cur = Math.max(1, Math.min(turns.length, n));
  document.querySelectorAll("[data-turn]").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.turn === cur)));
  document.querySelectorAll(".turn").forEach((s) => s.setAttribute("aria-current", String(s.id === `turn-${cur}`)));
  if (scroll) document.getElementById(`turn-${cur}`).scrollIntoView({ behavior: "smooth", block: "start" });
}
go(1, false);
G.themeInit();
</script>
</body>
</html>
