<style>
/*CORE_CSS*/

:root[data-theme=light] {

  --add: #15803d; --add-bg: #ecfdf3; --del: #b91c1c; --del-bg: #fef2f2; --model: #1d4ed8; --toolc: #6d28d9; --tool-bg: #f5f3ff;

<body>
<div id="top"></div>
<div class="cols">
  <nav class="toc card" aria-label="Turns" id="toc"></nav>
  <main id="main"></main>
  <aside class="sidebar card" id="side" aria-label="What this session touched"></aside>
</div>
<dialog id="dlg" aria-labelledby="mtitle"><div id="mwrap" style="display:contents"></div></dialog>
<script>/*CORE_JS*/</script>
<script>
"use strict";
const { S, turns, tools, effects, calls, esc, dur, clock, plural, num } = G;
document.getElementById("top").innerHTML = G.topbar("mockup 4 · story");

// ---------- what the session touched ----------
const allEff = [...effects.values()].sort((a, b) => a.at - b.at);
const changes = allEff.filter((e) => e.kind === "change");
const reads = allEff.filter((e) => e.kind === "read");
const conns = allEff.filter((e) => e.kind === "net");
const commands = [...tools.values()].filter((t) => t.name === "Bash").sort((a, b) => a.at - b.at);
const failed = [...tools.values()].filter((t) => !t.ok);
const outside = allEff.filter((e) => e.label === "outside");
const several = allEff.filter((e) => e.label === "several");
const hooksOnly = turns.filter((t) => t.hooksOnly);
const groupBy = (list, key) => { const m = new Map(); for (const e of list) { const k = key(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); } return m; };
const files = groupBy(changes, (e) => e.path);           // path → its changes, in time order
const readsBy = groupBy(reads, (e) => e.path);
const sites = groupBy(conns, (e) => e.host);
const where = (e) => (e.turn ? `turn ${e.turn}` : `between turns ${e.between} and ${e.between + 1}`);
const split = (p) => { const i = p.replace(/\/$/, "").lastIndexOf("/"); return i < 0 ? ["", p] : [p.slice(0, i + 1), p.slice(i + 1)]; };
const dirText = (d) => d || "project root";
const cmdHead = (c) => { const w = c.split(/\s+/).slice(0, 3); while (w.length > 1 && w[w.length - 1].startsWith("-")) w.pop(); return w.join(" "); };
const short = (t) => (t.name === "Bash" ? cmdHead(t.input.command) : `${t.name}${t.agent ? ` (${t.agent})` : ""}`);

// who did it, in plain words
function byText(e) {
  const t = e.tool && tools.get(e.tool);
  switch (e.label) {
    case "named": return `by ${short(t)}`;
    case "only_one": return `likely by ${short(t)}`;
    case "several": return `by one of ${e.cands.length} commands running together`;
    case "outside": return `with no tool running, likely you`;
    case "harness": return `by Claude Code itself`;
    default: return "";
  }
}
function whySentence(e) {
  const t = e.tool && tools.get(e.tool);
  const what = e.kind === "net" ? "host" : "file";
  switch (e.label) {
    case "named": return `${short(t)} names this ${what} in its input.`;
    case "only_one": return `${short(t)} was the only tool running at the time, but its input does not name this ${what}.`;
    case "several": return `${e.cands.map((id) => short(tools.get(id))).join(" and ")} were running together and neither names this ${what}, so no single one is picked.`;
    case "outside": return `No tool call was running. Most likely your own edit, or a background process.`;
    case "harness": return `${e.host} is one of Claude Code's own hosts (updates, telemetry), not something a tool asked for.`;
    default: return "";

function draw() {
  const m = render(stack[stack.length - 1]);
  wrap.innerHTML = `<header class="mh">${stack.length > 1 ? `<button type="button" class="x" data-back aria-label="Back">←</button>` : ""}<div class="tx"><span class="kick">${m.kick}</span><h2 id="mtitle">${m.title}</h2>${m.subt ? `<span class="subt">${m.subt}</span>` : ""}</div><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="mb">${m.body}</div>
    <footer class="mf"><span class="muted-note grow">Esc closes</span><button type="button" class="btn" data-close>Close</button>${m.goto ? `<button type="button" class="btn primary" data-goto="${esc(m.goto[0])}">${esc(m.goto[1])} →</button>` : ""}</footer>`;
  wrap.querySelector(".mb").scrollTop = 0;
}
function openModal(key, from) {
  if (!dlg.open) { stack = []; opener = from; }
  stack.push(key);
  draw();
  if (!dlg.open) dlg.showModal();
  (wrap.querySelector("[data-goto].primary") || wrap.querySelector("[data-close]")).focus();
}
dlg.addEventListener("close", () => { stack = []; if (opener && opener.isConnected) opener.focus(); });

// ---------- jump to a place in the story ----------
let lockUntilUserScrolls = false;
function setCurrent(id) {
  document.querySelectorAll(".toc a[data-turn]").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === `#${id}`)));
}
function sectionOf(el) { return el.closest(".turn, .btwentry"); }
function jump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const sec = sectionOf(el);
  if (sec) { setCurrent(sec.id); lockUntilUserScrolls = true; }
  el.scrollIntoView({ behavior: "smooth", block: el === sec ? "start" : "center" });
  const mark = el === sec ? el.querySelector(".th, h2") || el : el;
  mark.classList.remove("flash"); void mark.offsetWidth; mark.classList.add("flash");
}

// the turn in view: the last section whose top has passed 30% of the window. A click on a
// turn pins it until the user scrolls by hand, so the last turns can be selected even when
// the page cannot scroll them to the top.
const sections = [...document.querySelectorAll(".turn, .btwentry")];
function onScroll() {
  if (lockUntilUserScrolls) return;
  let cur = sections[0];
  for (const s of sections) if (s.getBoundingClientRect().top <= innerHeight * 0.3) cur = s;
  setCurrent(cur.id);
}
for (const ev of ["wheel", "touchmove", "keydown"]) addEventListener(ev, (e) => { if (ev !== "keydown" || ["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(e.key)) lockUntilUserScrolls = false; }, { passive: true });
addEventListener("scroll", onScroll, { passive: true });
onScroll();

// ---------- clicks ----------
document.body.addEventListener("click", (ev) => {
  const t = ev.target;
  const a = t.closest(".toc a[href^='#']");
  if (a) { ev.preventDefault(); jump(a.getAttribute("href").slice(1)); history.replaceState(null, "", a.getAttribute("href")); return; }
  if (t.closest("[data-close]")) { dlg.close(); return; }
  if (t.closest("[data-back]")) { stack.pop(); draw(); return; }
  const g = t.closest("[data-goto]");
  if (g) { dlg.close(); jump(g.dataset.goto); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { showTab(tab.dataset.tab, true); document.getElementById("side").classList.remove("flash"); void document.getElementById("side").offsetWidth; document.getElementById("side").classList.add("flash"); return; }
  const tb = t.closest(".tab");
  if (tb) { showTab(tb.id); return; }
  const j = t.closest("[data-jump]");
  if (j) { jump(j.dataset.jump); return; }
  const m = t.closest("[data-modal]");
  if (m) { openModal(m.dataset.modal, m); return; }
  const o = t.closest("[data-open]");   // side calls in the shared header toggle
  if (o) { openModal(`call:${o.dataset.open.split(":")[1]}`, o); }
});
document.querySelector(".tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ts = [...document.querySelectorAll(".tab")], i = ts.findIndex((x) => x.getAttribute("aria-selected") === "true");
  showTab(ts[(i + (e.key === "ArrowRight" ? 1 : ts.length - 1)) % ts.length].id, true);
});
document.addEventListener("animationend", (e) => e.target.classList.remove("flash"));
G.themeInit();
</script>
</body>
</html>
