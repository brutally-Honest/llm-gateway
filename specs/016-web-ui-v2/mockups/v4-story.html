<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>016 mockup 4 · Story</title>
<style>
/* 016 mockups: shared tokens and parts. Every text colour pair below is ≥ 4.5:1 on its
   background in both themes; status is always glyph + word, colour only repeats it. */
:root, :root[data-theme=dark] {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #3d444d; --line: #262c34;
  --text: #c9d1d9; --hi: #e6edf3; --muted: #9198a1; --accent: #58a6ff; --accent-bg: #0c2d4b;
  --ok: #3fb950; --bad: #ff7b72; --bad-bg: #2d1214; --warn: #d29922;
  --add: #56d364; --add-bg: #12261e; --del: #ffa198; --del-bg: #2d1214;
  --model: #79c0ff; --model-bg: #0c2d4b; --toolc: #d2a8ff; --tool-bg: #2a1e3d;
  --scrim: #010409b3;
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #ffffff; --panel: #f6f8fa; --panel2: #eef1f4; --border: #c8d1da; --line: #e1e6eb;
  --text: #24292f; --hi: #1f2328; --muted: #57606a; --accent: #0969da; --accent-bg: #ddf4ff;
  --ok: #1a7f37; --bad: #cf222e; --bad-bg: #ffebe9; --warn: #9a6700;
  --add: #1a7f37; --add-bg: #dafbe1; --del: #b3261e; --del-bg: #ffebe9;
  --model: #0550ae; --model-bg: #ddf4ff; --toolc: #6e40c9; --tool-bg: #f1e9ff;
  --scrim: #1f232866;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: 12.5px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--hi); text-decoration: none; }
.crumb { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 13px; color: var(--muted); }
.crumb b { color: var(--hi); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40ch; }
.vname { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 4px; padding: 0 6px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); min-height: 28px; }
.seg button[aria-pressed=true] { background: var(--accent-bg); color: var(--hi); font-weight: 600; }

/* session header */
.shead { display: flex; flex-direction: column; gap: 8px; }
.shead h1 { margin: 0; font-size: 20px; color: var(--hi); font-weight: 600; }
.meta { margin: 0; font-size: 12px; color: var(--muted); }
.facts-groups { display: flex; flex-wrap: wrap; gap: 8px; }
.fg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; }
.fgname { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fact { color: var(--muted); white-space: nowrap; }
.fact b { color: var(--hi); font-weight: 600; font-variant-numeric: tabular-nums; }
.facts-groups.compact .fg { padding: 4px 8px; }
details.side { font-size: 12px; color: var(--muted); }
details.side summary { cursor: pointer; display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; }
details.side summary:hover { color: var(--text); }
details.side ul { margin: 6px 0 2px; }

/* labels, statuses */
.lbl { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--hi); background: var(--panel2); }
.lbl-named { border-color: var(--ok); }
.lbl-only_one { border-color: var(--accent); }
.lbl-several { border-style: dashed; }
.lbl-outside { border-color: var(--warn); }
.lbl-harness { color: var(--muted); }
.st { white-space: nowrap; font-weight: 600; }
.st-ok { color: var(--ok); }
.st-failed { color: var(--bad); }
.errbox { border-left: 3px solid var(--bad); padding-left: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }
ul.plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }

/* rail prompts: clamped to 3 lines, full text on hover or focus */
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.clamp2 { -webkit-line-clamp: 2; line-clamp: 2; }
:is(a, button, li, div):is(:hover, :focus, :focus-within) > .clamp { -webkit-line-clamp: unset; line-clamp: unset; }

/* details view parts */
.dhead { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 15px; color: var(--hi); font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.kicker { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dsec { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dsec h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 12.5px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; color: var(--hi); overflow-wrap: anywhere; }
pre { margin: 0; font-size: 12px; color: var(--hi); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto; }
.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.diff div { padding: 1px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .dg { display: inline-block; width: 1.2em; color: var(--muted); }
.diff .ctx { color: var(--muted); }
.diff .add { color: var(--hi); background: var(--add-bg); }
.diff .add .dg { color: var(--add); }
.diff .del { color: var(--hi); background: var(--del-bg); }
.diff .del .dg { color: var(--del); }
.fileblock { display: flex; flex-direction: column; gap: 6px; }
.fileblock p { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
ul.elist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
ul.elist li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
ul.elist .elbl { min-width: 11.5rem; }
ul.elist code { overflow-wrap: anywhere; }
details.think summary { cursor: pointer; color: var(--accent); }
details.think pre { margin-top: 6px; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }

@media (max-width: 760px) {
  .crumb b { max-width: 20ch; }
}

/* ==== variant 4: turns left, the story in the middle, what the session touched on the
   right (files, commands, sites). One modal shape for every detail. Own neutral theme;
   every text pair is ≥ 4.5:1. ==== */
:root, :root[data-theme=dark] {
  --bg: #09090b; --card: #111114; --panel: #18181b; --panel2: #1f1f23; --border: #2a2a30; --line: #222227;
  --text: #e4e4e7; --hi: #fafafa; --muted: #a1a1aa; --accent: #a5b4fc; --accent-strong: #818cf8; --accent-bg: #1e1b4b; --on-accent: #0b0b1a;
  --ok: #4ade80; --ok-bg: #0d2818; --bad: #f87171; --bad-bg: #2a1215; --warn: #fbbf24; --warn-bg: #2a1f06;
  --add: #4ade80; --add-bg: #0f2a1a; --del: #fca5a5; --del-bg: #2d1215; --model: #93c5fd; --toolc: #c4b5fd; --tool-bg: #1e1830;
  --scrim: #000000b8; --shadow: 0 1px 2px #0006, 0 0 0 1px #ffffff08;
}
:root[data-theme=light] {
  --bg: #fafafa; --card: #ffffff; --panel: #f4f4f5; --panel2: #ededf0; --border: #e4e4e7; --line: #efeff1;
  --text: #27272a; --hi: #09090b; --muted: #52525b; --accent: #4338ca; --accent-strong: #4f46e5; --accent-bg: #eef2ff; --on-accent: #ffffff;
  --ok: #15803d; --ok-bg: #ecfdf3; --bad: #b91c1c; --bad-bg: #fef2f2; --warn: #a16207; --warn-bg: #fefce8;
  --add: #15803d; --add-bg: #ecfdf3; --del: #b91c1c; --del-bg: #fef2f2; --model: #1d4ed8; --toolc: #6d28d9; --tool-bg: #f5f3ff;
  --scrim: #09090b66; --shadow: 0 1px 2px #0000000d, 0 1px 3px #00000012;
}
html, body { font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.top { height: 56px; padding: 0 24px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; letter-spacing: -.01em; }
.crumb b { font-weight: 600; }
.vname { border-style: solid; border-color: var(--border); border-radius: 6px; padding: 1px 8px; }
.seg { border-radius: 8px; background: var(--panel); border-color: var(--border); padding: 2px; gap: 2px; }
.seg button { border-radius: 6px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed=true] { background: var(--card); color: var(--hi); box-shadow: var(--shadow); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--hi); white-space: nowrap; }
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { font-size: 12px; padding: 3px 9px; border-radius: 6px; }
.btn:focus-visible, .row:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

/* ---- three columns: two equal side cards, same top, same height ---- */
.cols { display: grid; grid-template-columns: 20rem minmax(0, 1fr) 20rem; grid-template-areas: "toc story side"; gap: 24px; max-width: 1480px; margin: 0 auto; padding: 24px; align-items: start; }
.toc { grid-area: toc; } main { grid-area: story; } .sidebar { grid-area: side; }
.toc, .sidebar { position: sticky; top: 80px; height: calc(100vh - 104px); display: flex; flex-direction: column; overflow: hidden; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.colhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.colhead h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--hi); }
.colhead .sub { font-size: 12px; color: var(--muted); }
.scroll { overflow: auto; flex: 1; scrollbar-width: thin; }

/* left: turns */
.toc ol { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.toc a { display: grid; grid-template-columns: 1.6rem 1fr; gap: 2px 10px; padding: 8px; border-radius: 8px; color: var(--text); text-decoration: none; }
.toc a:hover { background: var(--panel); }
.toc a[aria-current=true] { background: var(--accent-bg); }
.toc .n { grid-row: span 2; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--hi); background: var(--panel2); }
.toc a[aria-current=true] .n { background: var(--accent-strong); color: var(--on-accent); }
.toc .p { color: var(--hi); font-size: 13px; font-weight: 500; line-height: 1.4; }
.toc .m { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; }
.toc .m .bad { color: var(--bad); font-weight: 600; }
.toc .btw a { grid-template-columns: 1.6rem 1fr; padding: 4px 8px; }
.toc .btw .n { background: var(--warn-bg); color: var(--warn); grid-row: auto; width: 1.6rem; height: 1.3rem; border-radius: 6px; }
.toc .btw .p { color: var(--warn); font-size: 12px; font-weight: 600; }

/* right: what the session touched */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 10px 12px 0; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); }
.tab { all: unset; cursor: pointer; text-align: center; padding: 6px 4px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tab b { font-weight: 700; margin-left: 4px; color: inherit; }
.tab[aria-selected=true] { background: var(--card); color: var(--hi); box-shadow: var(--shadow); }
.tabp { padding: 4px 6px 10px; }
.tabp .lead { margin: 8px 10px 6px; font-size: 12px; color: var(--muted); }
.tabp h3 { margin: 12px 10px 4px; font-size: 12px; font-weight: 700; color: var(--hi); text-transform: uppercase; letter-spacing: .04em; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.row { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 1px 8px; padding: 8px 10px; border-radius: 8px; }
.row:hover { background: var(--panel); }
.row .ic { font-weight: 700; color: var(--muted); text-align: center; grid-row: span 2; }
.row .ic.ok { color: var(--ok); } .row .ic.bad { color: var(--bad); }
.row .t1 { color: var(--hi); font-weight: 600; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.row .t1 code { font-weight: 500; font-size: 12.5px; }
.row .t2 { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.row .t2 .warn { color: var(--warn); font-weight: 600; }
.row .t2 .bad { color: var(--bad); font-weight: 600; }
.row .r { font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.a { color: var(--add); } .d { color: var(--del); }
.tabfoot { margin: 8px 10px 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* centre */
main { display: flex; flex-direction: column; gap: 20px; min-width: 0; padding-bottom: 60vh; }
.hero { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.hero .status { display: inline-flex; align-self: flex-start; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; color: var(--hi); }
.hero .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.hero .meta span + span::before { content: "·"; margin-right: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { all: unset; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--card); }
button.kpi { cursor: pointer; } button.kpi:hover { background: var(--panel); } button.kpi:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.kpi .l { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.kpi .l i { font-style: normal; color: var(--accent); }
.kpi .v { font-size: 20px; font-weight: 700; color: var(--hi); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.attn h2 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--hi); }
.attn ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.attn button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 12px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--card); }
.attn button:hover { background: var(--panel); }
.attn button:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.attn .ic { width: 1.8rem; height: 1.8rem; border-radius: 8px; display: grid; place-items: center; font-weight: 700; }
.attn .bad .ic { background: var(--bad-bg); color: var(--bad); }
.attn .warn .ic { background: var(--warn-bg); color: var(--warn); }
.attn .info .ic { background: var(--panel2); color: var(--hi); }
.attn .t { color: var(--hi); font-weight: 600; font-size: 13.5px; }
.attn .s { color: var(--muted); font-size: 12.5px; display: block; }
.attn .go { color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
details.side summary { border-color: var(--border); }

.turn { scroll-margin-top: 80px; overflow: hidden; }
.th { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
.th .k { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.th .k b { font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.th h2 { grid-column: 1; margin: 0; font-size: 17px; line-height: 1.4; font-weight: 700; color: var(--hi); letter-spacing: -.01em; }
.th .dur { grid-column: 2; grid-row: 1 / span 2; align-self: start; text-align: right; }
.th .dur b { display: block; font-size: 18px; font-weight: 700; color: var(--hi); font-variant-numeric: tabular-nums; }
.th .dur span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tb { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
.pill.bad { color: var(--bad); background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.say .linkish { font-weight: 600; }
.cn { font-weight: 700; color: var(--model); }
ul.tools { list-style: none; margin: 6px 0 0 6px; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.tl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
.tl .si { font-weight: 700; }
.tl .si.ok { color: var(--ok); } .tl .si.failed { color: var(--bad); }
.tl .nm { color: var(--hi); font-weight: 700; }
.tl code { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
.tl .ls { font-size: 12px; font-weight: 600; }
.tl .tm { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tl.failed { background: var(--bad-bg); }
.why { font-size: 12.5px; color: var(--bad); margin: 2px 0 0 22px; font-weight: 500; }
ul.effs { list-style: none; margin: 4px 0 2px 22px; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
ul.effs > li { display: grid; grid-template-columns: 11rem minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; border-radius: 8px; padding: 2px 6px; margin-left: -6px; }
ul.effs .linkish code { color: var(--accent); }
.subagent { margin: 6px 0 2px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--toolc) 40%, transparent); background: var(--tool-bg); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
.subagent > .say { color: var(--toolc); font-weight: 600; }
.grp { font-size: 12.5px; color: var(--muted); margin: 8px 0 0 22px; font-weight: 600; border-radius: 8px; }
.answer { margin: 4px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--panel); color: var(--text); }

const commands = [...tools.values()].filter((t) => t.name === "Bash").sort((a, b) => a.at - b.at);
const failed = [...tools.values()].filter((t) => !t.ok);
const outside = allEff.filter((e) => e.label === "outside");
const several = allEff.filter((e) => e.label === "several");
const hooksOnly = turns.filter((t) => t.hooksOnly);
const groupBy = (list, key) => { const m = new Map(); for (const e of list) { const k = key(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); } return m; };
const files = groupBy(changes, (e) => e.path);           // path → its changes, in time order
const readsBy = groupBy(reads, (e) => e.path);
const sites = groupBy(conns, (e) => e.host);
const where = (e) => (e.turn ? `turn ${e.turn}` : `between turns ${e.between} and ${e.between + 1}`);
const split = (p) => { const i = p.replace(/\/$/, "").lastIndexOf("/"); return i < 0 ? ["", p] : [p.slice(0, i + 1), p.slice(i + 1)]; };
const dirText = (d) => d || "project root";
const cmdHead = (c) => { const w = c.split(/\s+/).slice(0, 3); while (w.length > 1 && w[w.length - 1].startsWith("-")) w.pop(); return w.join(" "); };
const short = (t) => (t.name === "Bash" ? cmdHead(t.input.command) : `${t.name}${t.agent ? ` (${t.agent})` : ""}`);

// who did it, in plain words
function byText(e) {
  const t = e.tool && tools.get(e.tool);
  switch (e.label) {
    case "named": return `by ${short(t)}`;
    case "only_one": return `likely by ${short(t)}`;
    case "several": return `by one of ${e.cands.length} commands running together`;
    case "outside": return `with no tool running, likely you`;
    case "harness": return `by Claude Code itself`;
    default: return "";
  }
}
function whySentence(e) {
  const t = e.tool && tools.get(e.tool);
  const what = e.kind === "net" ? "host" : "file";
  switch (e.label) {
    case "named": return `${short(t)} names this ${what} in its input.`;
    case "only_one": return `${short(t)} was the only tool running at the time, but its input does not name this ${what}.`;
    case "several": return `${e.cands.map((id) => short(tools.get(id))).join(" and ")} were running together and neither names this ${what}, so no single one is picked.`;
    case "outside": return `No tool call was running. Most likely your own edit, or a background process.`;
    case "harness": return `${e.host} is one of Claude Code's own hosts (updates, telemetry), not something a tool asked for.`;
    default: return "";
  }
}
const whyBlock = (e) => `<div class="why2">${G.labelBadge(e)}<span>${esc(whySentence(e))}</span></div>`;

// ---------- left: turns ----------
document.getElementById("toc").innerHTML = `<div class="colhead"><h2>Turns</h2><span class="sub">${plural(turns.length, "prompt")}</span></div><div class="scroll"><ol>` + turns.map((t) => {
  const f = t.tools.filter((x) => !x.ok).length;
  const c = G.counts(t.effects);
  const b = S.between.find((x) => x.after === t.n);
  return `<li><a href="#turn-${t.n}" data-turn="${t.n}" title="${esc(t.prompt)}"><span class="n">${t.n}</span><span class="p clamp clamp2">${esc(t.prompt)}</span><span class="m"><span>${t.hooksOnly ? "hooks only" : dur(t.end - t.at)}</span>${c.changed ? `<span>${plural(c.changed, "file")} changed</span>` : ""}${f ? `<span class="bad">✗ ${f} failed</span>` : ""}</span></a></li>`
    + (b ? `<li class="btw"><a href="#between-${t.n}" data-turn="b${t.n}"><span class="n" aria-hidden="true">○</span><span class="p">you edited ${esc(b.effects.map((e) => e.path).join(", "))}</span></a></li>` : "");
}).join("") + `</ol></div>`;

// ---------- right: files, commands, sites ----------
function fileRow(path) {
  const list = files.get(path), last = list[list.length - 1];
  const [dir, name] = split(path);
  const add = list.reduce((a, e) => a + (e.add || 0), 0), del = list.reduce((a, e) => a + (e.del || 0), 0);
  const right = last.binary ? "binary" : last.add != null ? `<span class="a">+${add}</span> <span class="d">−${del}</span>` : G.bytes(last.size);
  const out = last.label === "outside" ? ` class="warn"` : "";
  return `<li><button type="button" class="row" data-modal="file:${esc(path)}" title="${esc(G.full(path))}"><span class="ic" aria-hidden="true">${G.CHANGE[last.change][0]}</span><span class="t1">${esc(name)}</span><span class="r">${right}</span><span class="t2">${esc(dirText(dir))} · ${esc(last.change)} ${esc(where(last))} <span${out}>${esc(byText(last))}</span></span></button></li>`;
}
function cmdRow(t) {
  const c = G.counts(t.effects);
  const did = [c.changed && `${plural(c.changed, "file")} changed`, c.sites && plural(c.sites, "site")].filter(Boolean).join(" · ") || "nothing changed";
  return `<li><button type="button" class="row" data-modal="tool:${t.id}"><span class="ic ${t.ok ? "ok" : "bad"}" aria-label="${t.ok ? "ok" : "failed"}">${t.ok ? "✓" : "✗"}</span><span class="t1"><code>${esc(t.input.command)}</code></span><span class="r">${dur(t.dur)}</span><span class="t2">turn ${t.turn} · ${esc(did)}${t.call ? "" : " · seen by hooks only"}</span></button></li>`;
}
function siteRow(host) {
  const list = sites.get(host);
  const down = list.reduce((a, e) => a + e.down, 0);
  const ts = [...new Set(list.map((e) => e.turn))];
  const who = list[0].label === "harness" ? "Claude Code itself" : [...new Set(list.flatMap((e) => (e.tool ? [short(tools.get(e.tool))] : (e.cands || []).map((id) => short(tools.get(id))))))].join(", ");
  return `<li><button type="button" class="row" data-modal="site:${esc(host)}"><span class="ic" aria-hidden="true">${list[0].label === "harness" ? "⚙" : "⇄"}</span><span class="t1">${esc(host)}</span><span class="r">↓ ${G.bytes(down)}</span><span class="t2">${plural(list.length, "connection")} · ${ts.length > 1 ? "turns" : "turn"} ${ts.join(", ")} · ${esc(who)}</span></button></li>`;
}
const u = S.unassigned[0];
const readFiles = [...readsBy.keys()];
document.getElementById("side").innerHTML = `
  <div class="colhead"><h2>What this session touched</h2></div>
  <div class="tabs" role="tablist" aria-label="Files, commands and sites">
    <button type="button" class="tab" role="tab" id="tab-files" aria-controls="tp-files" aria-selected="true">Files<b>${files.size}</b></button>
    <button type="button" class="tab" role="tab" id="tab-cmds" aria-controls="tp-cmds" aria-selected="false" tabindex="-1">Commands<b>${commands.length}</b></button>
    <button type="button" class="tab" role="tab" id="tab-sites" aria-controls="tp-sites" aria-selected="false" tabindex="-1">Sites<b>${sites.size}</b></button>
  </div>
  <div class="scroll">
    <div class="tabp" role="tabpanel" id="tp-files" aria-labelledby="tab-files">
      <p class="lead">Every file that changed on disk. Open one to see its diff and who changed it.</p>
      <ul class="rows">${[...files.keys()].map(fileRow).join("")}</ul>
      <h3>Read by Claude · ${readFiles.length}</h3>
      <ul class="rows">${readFiles.map((p) => { const l = readsBy.get(p); const [dir, name] = split(p); return `<li><button type="button" class="row" data-modal="file:${esc(p)}"><span class="ic" aria-hidden="true">→</span><span class="t1">${esc(name)}</span><span class="r">${l.length > 1 ? `${l.length}×` : ""}</span><span class="t2">${esc(dirText(dir))} · ${esc(l.map((e) => where(e)).filter((v, i, a) => a.indexOf(v) === i).join(", "))}</span></button></li>`; }).join("")}</ul>
    </div>
    <div class="tabp" role="tabpanel" id="tp-cmds" aria-labelledby="tab-cmds" hidden>
      <p class="lead">Every shell command, in the order it ran. Open one for its output and what it changed.</p>
      <ul class="rows">${commands.map(cmdRow).join("")}</ul>
      <p class="tabfoot"><code>cat</code> and <code>ls</code> read files too, but only Claude's Read, Grep and Glob are recorded as reads.</p>
    </div>

      <ul class="rows">${[...sites.keys()].map(siteRow).join("")}</ul>
      <p class="tabfoot">Not in this session: <a href="sessions.html#unassigned">1 unassigned connection</a> to ${esc(u.host)} at ${clock(u.at)}, by Claude Code itself.</p>
    </div>
  </div>`;
function showTab(id, focus) {
  document.querySelectorAll(".tab").forEach((t) => { const on = t.id === id; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; document.getElementById(t.getAttribute("aria-controls")).hidden = !on; if (on && focus) t.focus(); });
}

// ---------- centre: overview ----------
function overview() {
  const st = G.sessionTime();
  const items = [];
  for (const t of failed) items.push(["bad", "✗", `${t.name} failed on ${G.toolArg(t)}`, `turn ${t.turn} · ${t.result.split("\n")[0]}`, `tool:${t.id}`, "Open"]);
  for (const [p, l] of files) if (l.some((e) => e.label === "outside")) items.push(["warn", "○", `${p} changed with no tool running`, `${where(l[0])} · most likely your own edit`, `file:${p}`, "Open"]);
  if (several.length) items.push(["info", "◌", `${plural(several.length, "change")} can't be pinned to one command`, `turn ${several[0].turn}: two commands ran together`, `jump:sev-${several[0].turn}`, `Show in turn ${several[0].turn}`]);
  for (const t of hooksOnly) items.push(["info", "◇", `Turn ${t.n} has no model calls captured`, "only the hooks saw it: its tool calls show, the conversation does not", `jump:turn-${t.n}`, `Show turn ${t.n}`]);
  const longest = commands.reduce((a, t) => (t.dur > a.dur ? t : a));
  const sum = (k) => [...calls.values()].reduce((a, x) => a + (x[k] || 0), 0);
  const added = changes.reduce((a, e) => a + (e.add || 0), 0), removed = changes.reduce((a, e) => a + (e.del || 0), 0);
  return `<section class="card hero" aria-label="Session overview">
    <span class="status">● Ended</span>
    <h1>${esc(S.title)}</h1>
    <div class="meta"><span>Today ${clock(S.side[0].at, false)}–${clock(S.end, false)}</span><span title="${esc(S.folder)}">~/code/shop-api</span><span>${esc(S.model)}</span><span title="session ${esc(S.id)}">claude-code</span></div>
    <div class="kpis">
      <div class="kpi"><span class="l">Time</span><span class="v">${dur(st.clock)}</span><span class="s">model ${dur(st.model)} · tools ${dur(st.tool)}</span></div>
      <button type="button" class="kpi" data-tab="tab-files"><span class="l">Files changed <i aria-hidden="true">→</i></span><span class="v">${files.size}</span><span class="s"><span class="a">+${added}</span> <span class="d">−${removed}</span> lines · ${readFiles.length} read</span></button>
      <button type="button" class="kpi" data-tab="tab-cmds"><span class="l">Commands <i aria-hidden="true">→</i></span><span class="v">${commands.length}</span><span class="s">longest ${esc(longest.input.command.split(" ").slice(0, 2).join(" "))}, ${dur(longest.dur)}</span></button>
      <button type="button" class="kpi" data-tab="tab-sites"><span class="l">Sites <i aria-hidden="true">→</i></span><span class="v">${sites.size}</span><span class="s">${plural(conns.length, "connection")}</span></button>
    </div>
    ${items.length ? `<div class="attn"><h2>Needs a look</h2><ul>${items.map(([k, ic, t, s, to, go]) => `<li class="${k}"><button type="button" data-${to.startsWith("jump:") ? "jump" : "modal"}="${esc(to.replace(/^jump:/, ""))}"><span class="ic" aria-hidden="true">${ic}</span><span><span class="t">${esc(t)}</span><span class="s">${esc(s)}</span></span><span class="go">${esc(go)} →</span></button></li>`).join("")}</ul></div>` : ""}
    <div class="foot"><span>Tokens: ${num(sum("in"))} input · ${num(sum("out"))} output · ${num(sum("cw"))} cache write · ${num(sum("cr"))} cache read</span>${G.sideToggle()}</div>
  </section>`;
}

// ---------- centre: turns ----------
function effLi(e) {
  const w = G.effectWhat(e);
  const key = e.kind === "net" ? `site:${e.host}` : `file:${e.path}`;
  const hasView = e.kind === "change" && (e.diff || e.content);
  return `<li id="eff-${e.id}">${G.labelBadge(e)}<span>${w.g} ${esc(w.w)} <button type="button" class="linkish" data-modal="${esc(key)}"><code title="${esc(e.kind === "net" ? "" : G.full(e.path))}">${esc(G.effectTarget(e))}</code></button></span><span class="muted small">${esc(G.effectStat(e))}</span>${hasView ? `<button type="button" class="btn sm" data-modal="${esc(key)}">${e.diff ? "Diff" : "View"}</button>` : "<span></span>"}</li>`;
}
function toolLi(x) {
  const s = G.STATUS(x);
  return `<li><div class="tl${x.ok ? "" : " failed"}" id="tool-${x.id}"><span class="si ${s.w}">${s.g}${x.ok ? "" : " failed"}</span><button type="button" class="linkish nm" data-modal="tool:${x.id}">${esc(x.name)}</button>${x.agent ? `<span class="agent">${esc(x.agent)}</span>` : ""}<code>${esc(G.toolArg(x))}</code>${G.lineStat(x) ? `<span class="ls"><span class="a">+${x.add}</span> <span class="d">−${x.del}</span></span>` : ""}<span class="tm">${dur(x.dur)}</span></div>${x.ok ? "" : `<div class="why">${esc(x.result.split("\n")[0])}</div>`}${x.effects.length ? `<ul class="effs">${x.effects.map(effLi).join("")}</ul>` : ""}${x.spawns ? subAgent(x) : ""}</li>`;
}
function subAgent(x) {
  const t = turns[x.turn - 1];
  const cs = t.calls.filter((c) => c.agent === x.spawns);
  return `<div class="subagent" role="group" aria-label="Sub-agent ${esc(x.spawns)}"><div class="say">Sub-agent ${esc(x.spawns)} · ${dur(x.dur)} · ${plural(cs.length, "model call")}</div><ol class="steps">${cs.map((c) => step(c, t)).join("")}</ol></div>`;
}
function step(c, t) {
  const mine = t.tools.filter((x) => x.call === c.n);
  const sev = t.several.filter((e) => e.cands.every((id) => tools.get(id).call === c.n));
  const then = mine.length === 0 ? "" : mine.length === 1 ? ", then ran:" : `, then ran ${mine.length} at once:`;
  return `<li class="step"><div class="say"><button type="button" class="linkish cn" data-modal="call:${c.n}">#${c.n}</button><span>${c.thinking ? "Thought and wrote" : mine.length ? "Wrote" : "Wrote the answer"} for ${dur(c.dur)}${then}</span>${c.thinking ? `<button type="button" class="linkish" data-modal="call:${c.n}">Read the thinking</button>` : ""}</div>${mine.length ? `<ul class="tools">${mine.map(toolLi).join("")}</ul>` : ""}${sev.length ? `<p class="grp" id="sev-${t.n}">◌ Not pinned to one command: ${esc(sev[0].cands.map((id) => short(tools.get(id))).join(" and "))} ran together</p><ul class="effs">${sev.map(effLi).join("")}</ul>` : ""}</li>`;
}
function turnCard(t) {
  const tt = G.turnTime(t), c = G.counts(t.effects), f = t.tools.filter((x) => !x.ok).length;
  const pills = [`${plural(t.tools.length, "tool call")}`, c.changed && `${plural(c.changed, "file")} changed`, c.read && `${c.read} read`, c.sites && plural(c.sites, "site")].filter(Boolean)
    .map((p) => `<span class="pill">${esc(p)}</span>`).join("") + (f ? `<span class="pill bad">✗ ${f} failed</span>` : "");
  const steps = t.hooksOnly
    ? `<ol class="steps"><li class="step"><div class="say">No model calls captured. The hooks saw:</div><ul class="tools">${t.tools.map(toolLi).join("")}</ul></li></ol>`
    : `<ol class="steps">${t.calls.filter((c) => !c.agent).map((c) => step(c, t)).join("")}</ol>`;
  const loose = t.unpinned.length ? `<p class="grp">○ Not caused by a tool call</p><ul class="effs">${t.unpinned.map(effLi).join("")}</ul>` : "";
  return `<article class="card turn" id="turn-${t.n}" aria-labelledby="h-${t.n}">
    <header class="th"><div class="k"><b>Turn ${t.n}</b><span>${clock(t.at)}</span></div>
      <div class="dur">${t.hooksOnly ? `<b>—</b><span>no model calls captured</span>` : `<b>${dur(tt.clock)}</b><span>model ${dur(tt.model)} · tools ${dur(tt.tool)}</span>`}</div>
      <h2 id="h-${t.n}">${esc(t.prompt)}</h2></header>
    <div class="tb"><div class="sum">${pills}</div>${steps}${loose}${t.answer ? `<div class="answer"><span class="who">Claude answered</span>${esc(t.answer)}</div>` : ""}</div></article>`;
}
document.getElementById("main").innerHTML = overview() + turns.map((t) => {
  const b = S.between.find((x) => x.after === t.n);
  return turnCard(t) + (b ? `<section class="card btwentry" id="between-${t.n}" aria-label="Between turns"><h2>Between turns ${t.n} and ${t.n + 1} · ${clock(b.effects[0].at)}</h2><p class="muted small" style="margin:0">A change while no tool call was running: most likely your own edit.</p><ul class="effs">${b.effects.map(effLi).join("")}</ul></section>` : "");
}).join("");

// ---------- modals: one shape for everything ----------
const fact = (l, v) => `<div class="mfact"><span class="l">${esc(l)}</span><span class="v">${v}</span></div>`;
const msec = (title, body, sub = "") => `<section class="ms"><h3>${title}${sub ? `<span class="sub">${sub}</span>` : ""}</h3>${body}</section>`;
const goBtn = (target, label) => `<button type="button" class="btn sm" data-goto="${esc(target)}">${esc(label)} →</button>`;
const shell = (kick, title, subt, body, goto) => ({ kick, title, subt, body, goto });

function fileModal(path) {
  const ch = files.get(path) || [], rd = readsBy.get(path) || [];
  const [dir] = split(path);
  const add = ch.reduce((a, e) => a + (e.add || 0), 0), del = ch.reduce((a, e) => a + (e.del || 0), 0);
  let body = `<div class="ms"><div class="mfacts">${fact("Changed", ch.length ? plural(ch.length, "time") : "never")}${ch.length && !ch[ch.length - 1].binary ? fact("Lines", `<span class="a">+${add}</span> <span class="d">−${del}</span>`) : ""}${ch.length ? fact("Size now", G.bytes(ch[ch.length - 1].size)) : ""}${fact("Read by Claude", rd.length ? plural(rd.length, "time") : "never")}</div></div>`;
  for (const e of ch) {
    body += msec(`${e.change[0].toUpperCase()}${e.change.slice(1)} in ${where(e)}`, whyBlock(e) + (e.binary ? `<p class="muted-note">Binary file: no copy is kept, so there is no diff.</p>` : G.diffHTML(e)), `${clock(e.at)} ${goBtn(`eff-${e.id}`, `Show in ${where(e)}`)}`);
  }
  if (rd.length) body += msec("Reads", `<ul class="mlist">${rd.map((e) => { const t = tools.get(e.tool); return `<li><b>${esc(where(e)[0].toUpperCase() + where(e).slice(1))}</b><span class="muted">${esc(t.name)}${t.agent ? ` in sub-agent ${esc(t.agent)}` : ""} · ${esc(e.detail)} · ${clock(e.at)}</span>${goBtn(`eff-${e.id}`, "Show")}</li>`; }).join("")}</ul>`);
  const first = ch[0] || rd[0];
  return shell(ch.length ? "File changed" : "File read", `<code>${esc(path)}</code>`, esc(G.full(path)), body, first && [`eff-${first.id}`, `Show in ${where(first)}`]);
}
function toolModal(t) {
  const c = t.call ? calls.get(t.call) : null;
  const isCmd = t.name === "Bash";
  const files2 = t.effects.filter((e) => e.kind !== "net"), nets = t.effects.filter((e) => e.kind === "net");
  const touched = files2.length || nets.length
    ? `<ul class="mlist">${files2.map((e) => `<li>${G.labelBadge(e)}<span>${G.effectWhat(e).g} ${esc(G.effectWhat(e).w)}</span><button type="button" class="linkish" data-modal="file:${esc(e.path)}"><code>${esc(e.path)}</code></button><span class="muted">${esc(G.effectStat(e))}</span></li>`).join("")}${nets.map((e) => `<li>${G.labelBadge(e)}<span>⇄ connected</span><button type="button" class="linkish" data-modal="site:${esc(e.host)}"><code>${esc(e.host)}:${e.port}</code></button><span class="muted">↑ ${G.bytes(e.up)} ↓ ${G.bytes(e.down)}</span></li>`).join("")}</ul>`
    : `<p class="muted-note">Nothing seen on disk or on the network${t.spawns ? " (a sub-agent's own tools carry their effects)" : ""}.</p>`;
  const status = t.ok ? `<span class="st st-ok">✓ ok</span>` : `<span class="st st-failed">✗ failed</span>`;
  const body = `<div class="ms"><div class="mfacts">${fact("Result", status)}${fact("Ran for", dur(t.dur))}${fact("When", `${clock(t.at)}–${clock(t.at + t.dur)}`)}${fact("Asked by", c ? `<button type="button" class="linkish" data-modal="call:${c.n}">model call #${c.n}</button>${c.agent ? ` (${esc(c.agent)})` : ""}` : "hooks only")}</div>${t.input.description ? `<p class="muted-note">${esc(t.input.description)}</p>` : ""}</div>`
    + msec("What it touched", touched)
    + msec(isCmd ? "Output" : "Result", `<div class="${t.ok ? "" : "errbox"}">${G.pre(t.result)}</div>`)
    + (isCmd ? "" : msec("Input", G.pre(JSON.stringify(t.input, null, 2))));
  return shell(`${isCmd ? "Command" : "Tool call"} · turn ${t.turn}${t.agent ? ` · sub-agent ${esc(t.agent)}` : ""}`, isCmd ? `<code>$ ${esc(t.input.command)}</code>` : `${esc(t.name)} <code>${esc(G.toolArg(t))}</code>`, "", body, [`tool-${t.id}`, `Show in turn ${t.turn}`]);
}
function siteModal(host) {
  const l = sites.get(host) || [];
  const up = l.reduce((a, e) => a + e.up, 0), down = l.reduce((a, e) => a + e.down, 0);
  let body = `<div class="ms"><div class="mfacts">${fact("Connections", l.length)}${fact("Downloaded", G.bytes(down))}${fact("Uploaded", G.bytes(up))}${fact("Port", l[0].port)}</div><p class="muted-note">HTTPS: the gateway sees host, bytes and timing, never the content.</p></div>`;
  for (const e of l) body += msec(`Connection in ${where(e)}`, whyBlock(e) + `<div class="mfacts">${fact("Outcome", e.outcome === "ok" ? "✓ ok" : esc(e.outcome))}${fact("Open for", dur(e.dur))}${fact("Bytes", `↑ ${G.bytes(e.up)} ↓ ${G.bytes(e.down)}`)}</div>`, `${clock(e.at)} ${goBtn(`eff-${e.id}`, `Show in ${where(e)}`)}`);
  return shell("Site", esc(host), `${plural(l.length, "connection")} in this session`, body, l[0] && [`eff-${l[0].id}`, `Show in ${where(l[0])}`]);
}
function callModal(n) {
  const c = calls.get(n);
  const ctx = c.in + c.cw + c.cr;
  const asked = [...tools.values()].filter((t) => t.call === c.n);
  const body = `<div class="ms"><div class="mfacts">${fact("Took", dur(c.dur))}${fact("Started", clock(c.at))}${fact("Stop reason", esc(c.stop || c.statusText || "—"))}${fact("Context size", num(ctx))}</div></div>`
    + msec("Tokens", `<div class="mfacts">${fact("Input", num(c.in))}${fact("Output", num(c.out))}${fact("Cache write", num(c.cw))}${fact("Cache read", num(c.cr))}</div>`)
    + (c.thinking ? msec("Thinking", G.pre(c.thinking)) : "")
    + (asked.length ? msec("Then ran", `<ul class="mlist">${asked.map((t) => `<li>${t.ok ? "✓" : "✗"} <button type="button" class="linkish" data-modal="tool:${t.id}"><b>${esc(t.name)}</b></button><code>${esc(G.toolArg(t))}</code><span class="muted">${dur(t.dur)}</span></li>`).join("")}</ul>`) : "")
    + (c.response ? msec("Response", G.pre(c.response)) : "");
  return shell(`Model call${c.side ? " · side call" : ""}${c.agent ? ` · sub-agent ${esc(c.agent)}` : ""}${c.turn ? ` · turn ${c.turn}` : ""}`, `#${c.n} · ${esc(S.model)}`, "", body, c.turn && [`turn-${c.turn}`, `Show turn ${c.turn}`]);
}
function render(key) {
  const i = key.indexOf(":"), k = key.slice(0, i), id = key.slice(i + 1);
  if (k === "file") return fileModal(id);
  if (k === "tool") return toolModal(tools.get(id));
  if (k === "site") return siteModal(id);
  if (k === "call") return callModal(+id);
  return null;
}
const dlg = document.getElementById("dlg"), wrap = document.getElementById("mwrap");
let stack = [], opener = null;
function draw() {
  const m = render(stack[stack.length - 1]);
  wrap.innerHTML = `<header class="mh">${stack.length > 1 ? `<button type="button" class="x" data-back aria-label="Back">←</button>` : ""}<div class="tx"><span class="kick">${m.kick}</span><h2 id="mtitle">${m.title}</h2>${m.subt ? `<span class="subt">${m.subt}</span>` : ""}</div><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="mb">${m.body}</div>
    <footer class="mf"><span class="muted-note grow">Esc closes</span><button type="button" class="btn" data-close>Close</button>${m.goto ? `<button type="button" class="btn primary" data-goto="${esc(m.goto[0])}">${esc(m.goto[1])} →</button>` : ""}</footer>`;
  wrap.querySelector(".mb").scrollTop = 0;
}
function openModal(key, from) {
  if (!dlg.open) { stack = []; opener = from; }
  stack.push(key);
  draw();
  if (!dlg.open) dlg.showModal();
  (wrap.querySelector("[data-goto].primary") || wrap.querySelector("[data-close]")).focus();
}
dlg.addEventListener("close", () => { stack = []; if (opener && opener.isConnected) opener.focus(); });

// ---------- jump to a place in the story ----------
let lockUntilUserScrolls = false;
function setCurrent(id) {
  document.querySelectorAll(".toc a[data-turn]").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === `#${id}`)));
}
function sectionOf(el) { return el.closest(".turn, .btwentry"); }
function jump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const sec = sectionOf(el);
  if (sec) { setCurrent(sec.id); lockUntilUserScrolls = true; }
  el.scrollIntoView({ behavior: "smooth", block: el === sec ? "start" : "center" });
  const mark = el === sec ? el.querySelector(".th, h2") || el : el;
  mark.classList.remove("flash"); void mark.offsetWidth; mark.classList.add("flash");
}

// the turn in view: the last section whose top has passed 30% of the window. A click on a
// turn pins it until the user scrolls by hand, so the last turns can be selected even when
// the page cannot scroll them to the top.
const sections = [...document.querySelectorAll(".turn, .btwentry")];
function onScroll() {
  if (lockUntilUserScrolls) return;
  let cur = sections[0];
  for (const s of sections) if (s.getBoundingClientRect().top <= innerHeight * 0.3) cur = s;
  setCurrent(cur.id);
}
for (const ev of ["wheel", "touchmove", "keydown"]) addEventListener(ev, (e) => { if (ev !== "keydown" || ["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(e.key)) lockUntilUserScrolls = false; }, { passive: true });
addEventListener("scroll", onScroll, { passive: true });
onScroll();

// ---------- clicks ----------
document.body.addEventListener("click", (ev) => {
  const t = ev.target;
  const a = t.closest(".toc a[href^='#']");
  if (a) { ev.preventDefault(); jump(a.getAttribute("href").slice(1)); history.replaceState(null, "", a.getAttribute("href")); return; }
  if (t.closest("[data-close]")) { dlg.close(); return; }
  if (t.closest("[data-back]")) { stack.pop(); draw(); return; }
  const g = t.closest("[data-goto]");
  if (g) { dlg.close(); jump(g.dataset.goto); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { showTab(tab.dataset.tab, true); document.getElementById("side").classList.remove("flash"); void document.getElementById("side").offsetWidth; document.getElementById("side").classList.add("flash"); return; }
  const tb = t.closest(".tab");
  if (tb) { showTab(tb.id); return; }
  const j = t.closest("[data-jump]");
  if (j) { jump(j.dataset.jump); return; }
  const m = t.closest("[data-modal]");
  if (m) { openModal(m.dataset.modal, m); return; }
  const o = t.closest("[data-open]");   // side calls in the shared header toggle
  if (o) { openModal(`call:${o.dataset.open.split(":")[1]}`, o); }
});
document.querySelector(".tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ts = [...document.querySelectorAll(".tab")], i = ts.findIndex((x) => x.getAttribute("aria-selected") === "true");
  showTab(ts[(i + (e.key === "ArrowRight" ? 1 : ts.length - 1)) % ts.length].id, true);
});
document.addEventListener("animationend", (e) => e.target.classList.remove("flash"));
G.themeInit();
</script>
</body>
