<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>016 mockup 4 · Story</title>
<style>
/* 016 mockups: shared tokens and parts. Every text colour pair below is ≥ 4.5:1 on its
   background in both themes; status is always glyph + word, colour only repeats it. */
:root, :root[data-theme=dark] {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #3d444d; --line: #262c34;
  --text: #c9d1d9; --hi: #e6edf3; --muted: #9198a1; --accent: #58a6ff; --accent-bg: #0c2d4b;
  --ok: #3fb950; --bad: #ff7b72; --bad-bg: #2d1214; --warn: #d29922;
  --add: #56d364; --add-bg: #12261e; --del: #ffa198; --del-bg: #2d1214;
  --model: #79c0ff; --model-bg: #0c2d4b; --toolc: #d2a8ff; --tool-bg: #2a1e3d;
  --scrim: #010409b3;
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #ffffff; --panel: #f6f8fa; --panel2: #eef1f4; --border: #c8d1da; --line: #e1e6eb;
  --text: #24292f; --hi: #1f2328; --muted: #57606a; --accent: #0969da; --accent-bg: #ddf4ff;
  --ok: #1a7f37; --bad: #cf222e; --bad-bg: #ffebe9; --warn: #9a6700;
  --add: #1a7f37; --add-bg: #dafbe1; --del: #b3261e; --del-bg: #ffebe9;
  --model: #0550ae; --model-bg: #ddf4ff; --toolc: #6e40c9; --tool-bg: #f1e9ff;
  --scrim: #1f232866;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: 12.5px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--hi); text-decoration: none; }
.crumb { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 13px; color: var(--muted); }
.crumb b { color: var(--hi); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40ch; }
.vname { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 4px; padding: 0 6px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); min-height: 28px; }
.seg button[aria-pressed=true] { background: var(--accent-bg); color: var(--hi); font-weight: 600; }

/* session header */
.shead { display: flex; flex-direction: column; gap: 8px; }
.shead h1 { margin: 0; font-size: 20px; color: var(--hi); font-weight: 600; }
.meta { margin: 0; font-size: 12px; color: var(--muted); }
.facts-groups { display: flex; flex-wrap: wrap; gap: 8px; }
.fg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; }
.fgname { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fact { color: var(--muted); white-space: nowrap; }
.fact b { color: var(--hi); font-weight: 600; font-variant-numeric: tabular-nums; }
.facts-groups.compact .fg { padding: 4px 8px; }
details.side { font-size: 12px; color: var(--muted); }
details.side summary { cursor: pointer; display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; }
details.side summary:hover { color: var(--text); }
details.side ul { margin: 6px 0 2px; }

/* labels, statuses */
.lbl { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--hi); background: var(--panel2); }
.lbl-named { border-color: var(--ok); }
.lbl-only_one { border-color: var(--accent); }
.lbl-several { border-style: dashed; }
.lbl-outside { border-color: var(--warn); }
.lbl-harness { color: var(--muted); }
.st { white-space: nowrap; font-weight: 600; }
.st-ok { color: var(--ok); }
.st-failed { color: var(--bad); }
.errbox { border-left: 3px solid var(--bad); padding-left: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }
ul.plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }

/* rail prompts: clamped to 3 lines, full text on hover or focus */
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.clamp2 { -webkit-line-clamp: 2; line-clamp: 2; }
:is(a, button, li, div):is(:hover, :focus, :focus-within) > .clamp { -webkit-line-clamp: unset; line-clamp: unset; }

/* details view parts */
.dhead { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 15px; color: var(--hi); font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.kicker { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dsec { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dsec h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 12.5px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; color: var(--hi); overflow-wrap: anywhere; }
pre { margin: 0; font-size: 12px; color: var(--hi); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto; }
.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.diff div { padding: 1px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .dg { display: inline-block; width: 1.2em; color: var(--muted); }
.diff .ctx { color: var(--muted); }
.diff .add { color: var(--hi); background: var(--add-bg); }
.diff .add .dg { color: var(--add); }
.diff .del { color: var(--hi); background: var(--del-bg); }
.diff .del .dg { color: var(--del); }
.fileblock { display: flex; flex-direction: column; gap: 6px; }
.fileblock p { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
ul.elist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
ul.elist li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
ul.elist .elbl { min-width: 11.5rem; }
ul.elist code { overflow-wrap: anywhere; }
details.think summary { cursor: pointer; color: var(--accent); }
details.think pre { margin-top: 6px; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }

@media (max-width: 760px) {
  .crumb b { max-width: 20ch; }
}

/* ==== variant 4: turns left, the story in the middle, the session's files, commands and
   network on the right. Its own neutral theme; every text pair is ≥ 4.5:1. ==== */
:root, :root[data-theme=dark] {
  --bg: #09090b; --card: #111114; --panel: #18181b; --panel2: #1f1f23; --border: #2a2a30; --line: #222227;
  --text: #e4e4e7; --hi: #fafafa; --muted: #a1a1aa; --accent: #a5b4fc; --accent-strong: #818cf8; --accent-bg: #1e1b4b;
  --ok: #4ade80; --ok-bg: #0d2818; --bad: #f87171; --bad-bg: #2a1215; --warn: #fbbf24; --warn-bg: #2a1f06;
  --add: #4ade80; --add-bg: #0f2a1a; --del: #fca5a5; --del-bg: #2d1215; --model: #93c5fd; --toolc: #c4b5fd; --tool-bg: #1e1830;
  --scrim: #000000b8; --shadow: 0 1px 2px #0006, 0 0 0 1px #ffffff08;
}
:root[data-theme=light] {
  --bg: #fafafa; --card: #ffffff; --panel: #f4f4f5; --panel2: #ededf0; --border: #e4e4e7; --line: #efeff1;
  --text: #27272a; --hi: #09090b; --muted: #52525b; --accent: #4338ca; --accent-strong: #4f46e5; --accent-bg: #eef2ff;
  --ok: #15803d; --ok-bg: #ecfdf3; --bad: #b91c1c; --bad-bg: #fef2f2; --warn: #a16207; --warn-bg: #fefce8;
  --add: #15803d; --add-bg: #ecfdf3; --del: #b91c1c; --del-bg: #fef2f2; --model: #1d4ed8; --toolc: #6d28d9; --tool-bg: #f5f3ff;
  --scrim: #09090b66; --shadow: 0 1px 2px #0000000d, 0 1px 3px #00000012;
}
html, body { font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.top { height: 56px; padding: 0 24px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; letter-spacing: -.01em; }
.crumb b { font-weight: 600; }
.vname { border-style: solid; border-color: var(--border); border-radius: 6px; padding: 1px 8px; }
.seg { border-radius: 8px; background: var(--panel); border-color: var(--border); padding: 2px; gap: 2px; }
.seg button { border-radius: 6px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed=true] { background: var(--card); color: var(--hi); box-shadow: var(--shadow); }

/* three columns, equal sides */
.cols { display: grid; grid-template-columns: 20rem minmax(0, 1fr) 20rem; grid-template-areas: "toc story side"; gap: 24px; max-width: 1480px; margin: 0 auto; padding: 24px; align-items: start; }
.toc { grid-area: toc; } main { grid-area: story; } .sidebar { grid-area: side; }
.toc, .sidebar { position: sticky; top: 80px; max-height: calc(100vh - 96px); overflow: auto; scrollbar-width: thin; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.colhead { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--hi); letter-spacing: .02em; text-transform: uppercase; }

/* left: turns */
.toc ol { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.toc a { display: grid; grid-template-columns: 1.6rem 1fr; gap: 2px 8px; padding: 8px; border-radius: 8px; color: var(--text); text-decoration: none; }
.toc a:hover { background: var(--panel); }
.toc a[aria-current=true] { background: var(--accent-bg); }
.toc .n { grid-row: span 2; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--hi); background: var(--panel2); }
.toc a[aria-current=true] .n { background: var(--accent-strong); color: #fff; }
.toc .p { color: var(--hi); font-size: 13px; font-weight: 500; line-height: 1.4; }
.toc .m { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
.toc .btw { font-size: 12px; color: var(--muted); padding: 2px 8px 6px 2.9rem; }
.toc .btw a { display: inline; padding: 0; color: var(--warn); }

/* centre: overview + turns */
main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.hero { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.hero .status { display: inline-flex; align-self: flex-start; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; color: var(--hi); }
.hero .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.hero .meta span + span::before { content: "·"; margin-right: 14px; color: var(--muted); }
.lead { margin: 0; font-size: 16px; line-height: 1.6; color: var(--text); }
.lead b { color: var(--hi); font-weight: 700; }
.attn h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--hi); }
.attn ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.attn button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 1.8rem 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--card); }
.attn button:hover { background: var(--panel); }
.attn button:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
.attn .ic { width: 1.8rem; height: 1.8rem; border-radius: 8px; display: grid; place-items: center; font-weight: 700; }
.attn .bad .ic { background: var(--bad-bg); color: var(--bad); }
.attn .warn .ic { background: var(--warn-bg); color: var(--warn); }
.attn .info .ic { background: var(--panel2); color: var(--hi); }
.attn .t { color: var(--hi); font-weight: 600; font-size: 13.5px; }
.attn .s { color: var(--muted); font-size: 12.5px; display: block; font-weight: 400; }
.attn .go { color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--card); }
.kpi .l { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 700; color: var(--hi); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
details.side summary { border-color: var(--border); }

.turn { scroll-margin-top: 80px; overflow: hidden; }
.th { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
.th .k { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.th .k .linkish { font-weight: 700; color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.th h2 { grid-column: 1; margin: 0; font-size: 17px; line-height: 1.4; font-weight: 700; color: var(--hi); letter-spacing: -.01em; }
.th .dur { grid-column: 2; grid-row: 1 / span 2; align-self: start; text-align: right; }
.th .dur b { display: block; font-size: 18px; font-weight: 700; color: var(--hi); font-variant-numeric: tabular-nums; }
.th .dur span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tb { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
.pill.bad { color: var(--bad); background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.say .linkish { font-weight: 600; }
.cn { font-weight: 700; color: var(--model); }
ul.tools { list-style: none; margin: 6px 0 0 6px; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.tl { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
.tl .si { font-weight: 700; }
.tl .si.ok { color: var(--ok); } .tl .si.failed { color: var(--bad); }
.tl .nm { color: var(--hi); font-weight: 700; }
.tl code { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
.tl .ls { font-size: 12px; font-weight: 600; }
.tl .tm { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tl.failed { background: var(--bad-bg); }
.why { font-size: 12.5px; color: var(--bad); margin: 2px 0 0 22px; font-weight: 500; }
ul.effs { list-style: none; margin: 4px 0 2px 22px; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
ul.effs > li { border-radius: 8px; padding: 2px 6px; margin-left: -6px; }
ul.effs > li > .eh { display: grid; grid-template-columns: 11rem minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
ul.effs .eh .linkish code { color: var(--accent); }
ul.effs details > summary { cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; list-style: none; width: max-content; }
ul.effs details > summary::before { content: "▸ "; }
ul.effs details[open] > summary::before { content: "▾ "; }
ul.effs details > .diff, ul.effs details > pre, ul.effs details > p { margin: 6px 0; }
.sub { margin: 6px 0 2px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--toolc) 40%, transparent); background: var(--tool-bg); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
.sub > .say { color: var(--toolc); font-weight: 600; }
.grp { font-size: 12.5px; color: var(--muted); margin: 8px 0 0 22px; font-weight: 600; border-radius: 8px; }
.answer { margin: 4px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--panel); color: var(--text); }
.answer .who { display: block; font-size: 12px; font-weight: 700; color: var(--hi); margin-bottom: 2px; }
.btwentry { border: 1px dashed color-mix(in srgb, var(--warn) 60%, transparent); background: var(--warn-bg); padding: 14px 20px; display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 80px; }
.btwentry h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--hi); }
.btwentry ul.effs { margin-left: 0; }
.agent { font-size: 11px; font-weight: 600; color: var(--toolc); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; }

/* labels and diffs in this theme */
.lbl { font-weight: 600; border-radius: 6px; padding: 0 7px; background: var(--panel); border-color: var(--border); }
.lbl-named { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.lbl-only_one { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.lbl-outside { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.lbl-harness { color: var(--text); }
.diff { border-radius: 8px; border-color: var(--border); }
pre { border-radius: 8px; border-color: var(--border); }

/* right: the session's files, commands, network */
.sidebar { display: flex; flex-direction: column; gap: 14px; }
.pc > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
.pc h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--hi); }
.pc .cnt { font-size: 12px; font-weight: 700; color: var(--hi); background: var(--panel2); border-radius: 999px; padding: 0 8px; }
.pc .hint { margin: 0; padding: 0 16px 8px; font-size: 12px; color: var(--muted); }
.pc ul { list-style: none; margin: 0; padding: 0 6px 8px; display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; border-radius: 8px; }
.prow:hover { background: var(--panel); }
.pj { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 10px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pj:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: -2px; border-radius: 8px; }
.pj .l1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.pj .l1 code { color: var(--hi); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.pj .l1 .g { font-weight: 700; color: var(--muted); width: .9rem; flex: none; }
.pj .l2 { font-size: 12px; color: var(--muted); padding-left: 1.4rem; }
.pj .l2 .bad { color: var(--bad); font-weight: 600; }
.ad { font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ad .a { color: var(--add); } .ad .d { color: var(--del); }
.pd { all: unset; cursor: pointer; margin: 7px 8px 0 0; font-size: 12px; font-weight: 600; color: var(--accent); padding: 1px 6px; border-radius: 6px; }

  if (cur) total += cur[1] - cur[0];
  return total;
}

// turn time: clock from prompt to final answer, split into model time and tool time.
// A sub-agent's Agent call is not tool time: its model calls already count as model time.
function turnTime(t) {
  const m = t.calls.map((c) => [c.at, c.at + c.dur]);
  const k = t.tools.filter((x) => !x.spawns).map((x) => [x.at, x.at + x.dur]);

}
function sessionTime() {
  const ts = turns.map(turnTime);
  return {
    clock: S.end - S.side[0].at,
    model: ts.reduce((a, x) => a + x.model, 0),
    tool: ts.reduce((a, x) => a + x.tool, 0),

}

// effect counts: distinct changed files, read files, sites
function counts(list) {
  const ch = new Set(), rd = new Set(), st = new Set();
  for (const e of list) (e.kind === "change" ? ch : e.kind === "read" ? rd : st).add(e.kind === "net" ? e.host : e.path);
  return { changed: ch.size, read: rd.size, sites: st.size };
}
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
function countsText(c, empty = "no effects") {
  const parts = [];
  if (c.changed) parts.push(`${c.changed} changed`);
  if (c.read) parts.push(`${c.read} read`);
  if (c.sites) parts.push(plural(c.sites, "site"));
  return parts.length ? parts.join(" · ") : empty;
}

const LABELS = {
  named: { g: "●", w: "named", why: "the tool's input names this target" },
  only_one: { g: "◐", w: "only one running", why: "the only tool call running in the effect's window; its input does not name the target" },
  several: { g: "◌", w: "several running", why: "two or more tool calls were running and none names the target; none is picked" },
  outside: { g: "○", w: "outside any tool call", why: "no tool call was running — usually your own edit, or a background process" },
  harness: { g: "⚙", w: "harness", why: "the host is on Claude Code's own host list (telemetry, updates)" },

const CHANGE = { created: "+ created", modified: "~ modified", deleted: "− deleted" };
const STATUS = (t) => (t.ok ? { g: "✓", w: "ok" } : { g: "✗", w: "failed" });

// what a tool line says after the name
function toolArg(t) {
  const i = t.input || {};
  switch (t.name) {
    case "Bash": return i.command;
    case "Read": return rel(i.file_path);
    case "Edit": case "Write": return rel(i.file_path);
    case "Grep": return `“${i.pattern}” in ${i.path || "."}`;
    case "Glob": return i.pattern;
    case "WebFetch": return i.url.replace(/^https?:\/\//, "");

}
const lineStat = (t) => (t.add != null && (t.name === "Edit" || t.name === "Write") && t.ok ? `+${t.add} −${t.del}` : "");
const toolNo = (t) => (t.call ? `#${t.call}` : "");
const toolRef = (t) => `${t.call ? `#${t.call} ` : ""}${t.name}${t.agent ? ` (${t.agent})` : ""}`;

}

  if (e.kind === "read") return { g: "→", w: "read" };

}
function effectStat(e) {

  if (e.kind === "read") return e.detail;
  if (e.binary) return `${bytes(e.size)} · binary`;
  return e.add != null ? `+${e.add} −${e.del} · ${bytes(e.size)}` : bytes(e.size);
}

// ---------- session header facts: every number has a label ----------
function sessionFacts() {

    + sec("Facts", effectRowFacts(e))
    + (e.kind === "change" ? sec(e.diff ? "Diff" : "Content", diffHTML(e)) : "")

}
function effList(list) {

}
function detailTool(t) {

  return `<header class="dhead"><p class="kicker">Tool call · turn ${t.turn}${t.agent ? ` · sub-agent ${esc(t.agent)}` : ""}</p><h2><span class="st st-${s.w}">${s.g} ${s.w}</span> ${esc(t.name)} <span class="muted">${esc(toolArg(t))}</span></h2></header>`
    + sec("Timings", dl([["asked by", c ? `model call #${c.n}${c.agent ? ` (${esc(c.agent)})` : ""}` : "no model call captured (seen by hooks only)"], ["started", clock(t.at)], ["ended", clock(t.at + t.dur)], ["run time", dur(t.dur)], t.spawns && ["note", "spawns a sub-agent: never an effect's candidate, and its span is not counted as tool time"]]))
    + sec("Input", json(t.input))
    + sec("Result", `<div class="${t.ok ? "" : "errbox"}">${t.ok ? "" : `<p class="st st-failed">✗ failed</p>`}${pre(t.result)}</div>`)
    + sec(`Files (${files.length})`, files.length ? files.map((e) => `<div class="fileblock"><p>${labelBadge(e)} ${effectWhat(e).g} ${esc(effectWhat(e).w)} <code title="${esc(full(e.path))}">${esc(e.path)}</code> <span class="muted">${esc(effectStat(e))}</span></p>${e.kind === "change" ? diffHTML(e) : ""}</div>`).join("") : `<p class="muted">No file changes or reads attributed to this call.</p>`)

function detailCall(c) {

  const prevCtx = prev ? prev.in + prev.cw + prev.cr : null;
  const asked = [...tools.values()].filter((t) => t.call === c.n);
  return `<header class="dhead"><p class="kicker">Model call${c.side ? " · side call" : ""}${c.agent ? ` · sub-agent ${esc(c.agent)}` : ""}${c.turn ? ` · turn ${c.turn}` : ""}</p><h2>#${c.n} <span class="muted">${esc(S.model)}</span></h2></header>`
    + sec("Timings", dl([["started", clock(c.at)], ["duration", dur(c.dur)], ["stop reason", esc(c.stop || (c.side ? c.statusText : "—"))]]))
    + sec("Tokens", dl([["input", num(c.in)], ["output", num(c.out)], ["cache write", num(c.cw)], ["cache read", num(c.cr)], ["context size", `${num(ctx)} <span class="muted">(input + cache write + cache read)</span>`], ["change since previous call", prevCtx == null ? "first call of its thread" : `${ctx >= prevCtx ? "+" : "−"}${num(Math.abs(ctx - prevCtx))}`]]))
    + (c.thinking ? sec("Thinking", `<details class="think"><summary>Show thinking (${num(Math.round(c.thinking.length / 4))} tokens)</summary>${pre(c.thinking)}</details>`) : "")
    + (asked.length ? sec(`Tools asked (${asked.length})`, `<ul class="plain">${asked.map((t) => `<li>${STATUS(t).g} ${esc(t.name)} <span class="muted">${esc(toolArg(t))}</span></li>`).join("")}</ul>`) : "")
    + (c.response ? sec("Response", pre(c.response)) : "")
    + sec("Raw", `<p><a href="#" onclick="return false">request</a> · <a href="#" onclick="return false">response stream</a> · <a href="#" onclick="return false">headers</a> <span class="muted">(mock links)</span></p>`);
}
function detailTurn(t) {
  const tt = turnTime(t), c = counts(t.effects);
  return `<header class="dhead"><p class="kicker">Turn ${t.n} · ${clock(t.at)}</p><h2>${esc(t.prompt)}</h2></header>`
    + sec("Time", t.hooksOnly ? `<p>No model calls captured. Tool time ${dur(tt.tool)}.</p>` : dl([["prompt to final answer", dur(tt.clock)], ["model time", dur(tt.model)], ["tool time", dur(tt.tool)], ["waiting", dur(tt.wait)]]))
    + sec("Calls", t.calls.length ? `<p>${t.calls.map((x) => `#${x.n}${x.agent ? ` (${esc(x.agent)})` : ""} ${dur(x.dur)}`).join(" · ")}</p>` : `<p class="muted">no model calls captured</p>`)
    + sec(`Effects · ${countsText(c)}`, effList(t.effects))
    + (t.answer ? sec("Final answer", pre(t.answer)) : "");
}
function detailSide(s) {
  return detailCall(calls.get(s.n));
}
function detail(kind, id) {
  if (kind === "tool") return detailTool(tools.get(id));
  if (kind === "call") return detailCall(calls.get(+id));
  if (kind === "effect") return detailEffect(effects.get(+id));
  if (kind === "turn") return detailTurn(turns[+id - 1]);
  return "";
}

// walk is a turn's rows in reading order: each model call, the tools it asked for with
// their effects beneath, a sub-agent's calls under its Agent tool, a "several running"
// group after the parallel tools it names, effects no tool caused, then the answer.
// A call and its tools share a depth; effects and sub-agent rows are one deeper.
function walk(t) {
  const out = [];
  const asked = (c) => t.tools.filter((x) => x.call === c.n);
  const emitTool = (x, d) => {
    out.push({ type: "tool", t: x, depth: d });
    for (const e of x.effects) out.push({ type: "effect", e, depth: d + 1 });
    if (x.spawns) for (const c of t.calls.filter((c) => c.agent === x.spawns)) emitCall(c, d + 1);
  };
  const emitCall = (c, d) => {
    out.push({ type: "call", c, depth: d });
    const mine = asked(c);
    for (const x of mine) emitTool(x, d);
    const sev = t.several.filter((e) => e.cands.every((id) => tools.get(id).call === c.n));
    if (sev.length) {
      out.push({ type: "group", kind: "several", depth: d, effects: sev, title: `not pinned to one tool: ${sev[0].cands.map((id) => toolShort(tools.get(id))).join(" and ")} were running` });
      for (const e of sev) out.push({ type: "effect", e, depth: d + 1 });
    }
  };
  if (t.hooksOnly) {
    out.push({ type: "note", text: "no model calls captured", depth: 0 });
    for (const x of t.tools) emitTool(x, 0);
  }
  for (const c of t.calls.filter((c) => !c.agent)) emitCall(c, 0);
  if (t.unpinned.length) {
    out.push({ type: "group", kind: "loose", depth: 0, effects: t.unpinned, title: "not caused by a tool call" });
    for (const e of t.unpinned) out.push({ type: "effect", e, depth: 1 });
  }
  if (t.answer) out.push({ type: "answer", text: t.answer, depth: 0 });
  return out;
}
// during says which tool was running when an effect happened, for loose effects
function during(e) {
  const run = [...tools.values()].filter((x) => !x.spawns && x.at <= e.at && e.at <= x.at + x.dur);
  return run.length ? `during ${run.map(toolRef).join(", ")}` : "";
}

// ---------- shared chrome ----------
function themeInit() {

}
function themeButtons() {
  return `<div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-btn="dark">☾ Dark</button><button type="button" data-theme-btn="light">☀ Light</button></div>`;
}
function topbar(variantName) {

}
function headerFacts(compact = false) {
  const f = sessionFacts();

}
function sessionMeta() {

function turnTimeText(t) {

function railMeta(t) {

return { S, T0, FOLDER, turns, tools, calls, effects, clock, dur, num, bytes, esc, rel, full, union, turnTime, sessionTime, counts, countsText, plural,
  LABELS, CHANGE, STATUS, toolArg, lineStat, toolNo, toolRef, toolShort, labelTools, effectTarget, effectWhat, effectStat, labelBadge, diffHTML,

})();

<script>
"use strict";
const { S, turns, tools, effects, esc, dur, clock, plural, num } = G;
document.getElementById("top").innerHTML = G.topbar("mockup 4 · story");

// ---------- session-wide lists ----------
const allEff = [...effects.values()].sort((a, b) => a.at - b.at);

function fileRow(e) {

}
function cmdRow(t) {
  return `<li class="prow"><button type="button" class="pj" data-jump="tool-${t.id}"><span class="l1"><span class="g" aria-hidden="true">$</span><code>${esc(t.input.command)}</code></span><span class="l2">Turn ${t.turn} · ${t.ok ? "✓ ok" : `<span class="bad">✗ failed</span>`} · ${dur(t.dur)}${t.call ? "" : " · seen by hooks only"}${t.effects.length ? ` · ${esc(G.countsText(G.counts(t.effects)))}` : ""}</span></button></li>`;
}
function netRow(e) {
  return `<li class="prow"><button type="button" class="pj" data-jump="eff-${e.id}"><span class="l1"><span class="g" aria-hidden="true">⇄</span><code>${esc(e.host)}:${e.port}</code></span><span class="l2">${esc(where(e))} · ${esc(LW(e))}${e.tool ? ` · ${esc(G.toolRef(tools.get(e.tool)))}` : ""} · ↑ ${G.bytes(e.up)} ↓ ${G.bytes(e.down)}</span></button></li>`;
}
const u = S.unassigned[0];
document.getElementById("side").innerHTML = `
  <section class="card pc" aria-labelledby="h-files"><header><h2 id="h-files">Files changed</h2><span class="cnt">${changes.length}</span></header>
    <p class="hint">Click a file to jump to the turn that changed it, or open its diff here.</p>
    <ul>${changes.map(fileRow).join("")}</ul>
    <details class="reads"><summary>${plural(new Set(reads.map((e) => e.path)).size, "file")} read by Claude's tools (${plural(reads.length, "read")})</summary><ul>${reads.map((e) => `<li class="prow"><button type="button" class="pj" data-jump="eff-${e.id}"><span class="l1"><span class="g" aria-hidden="true">→</span><code title="${esc(G.full(e.path))}">${esc(e.path)}</code></span><span class="l2">${esc(where(e))} · ${esc(e.detail)}</span></button></li>`).join("")}</ul></details>
  </section>
  <section class="card pc" aria-labelledby="h-cmds"><header><h2 id="h-cmds">Commands run</h2><span class="cnt">${commands.length}</span></header>
    <p class="hint">Every shell command, in order. <code>cat</code> and <code>ls</code> read files too, but only Claude's Read, Grep and Glob show up as reads.</p>
    <ul>${commands.map(cmdRow).join("")}</ul>
  </section>
  <section class="card pc" aria-labelledby="h-net"><header><h2 id="h-net">Network</h2><span class="cnt">${conns.length}</span></header>
    <p class="hint">Connections through the gateway's proxy. HTTPS shows host, bytes and timing only.</p>
    <ul>${conns.map(netRow).join("")}</ul>
    <p class="pfoot">Outside this session: <a href="sessions.html#unassigned">1 unassigned connection</a> to ${esc(u.host)} at ${clock(u.at)} (⚙ harness, ${esc(u.client)}).</p>
  </section>`;

// ---------- centre: overview ----------
function overview() {
  const st = G.sessionTime();
  const c = G.counts(allEff);
  const items = [];
  for (const t of failed) items.push(["bad", "✗", `A tool call failed: ${t.name} ${G.toolArg(t)}`, `turn ${t.turn} · ${t.result.split("\n")[0]}`, `tool-${t.id}`]);
  if (outside.length) items.push(["warn", "○", `${plural(outside.length, "file")} changed while no tool was running`, `${outside.map((e) => e.path).join(", ")} · between turns ${outside[0].between} and ${outside[0].between + 1}, most likely your own edit`, `between-${outside[0].between}`]);
  if (several.length) items.push(["info", "◌", `${plural(several.length, "effect")} not pinned to one tool`, `turn ${several[0].turn}: two commands ran at once, so both are listed`, `sev-${several[0].turn}`]);
  for (const t of hooksOnly) items.push(["info", "◇", `Turn ${t.n} has no model calls captured`, "only the hooks saw it: its tool calls show, the conversation does not", `turn-${t.n}`]);
  const longest = commands.reduce((a, t) => (t.dur > a.dur ? t : a));
  const sum = (k) => [...G.calls.values()].reduce((a, x) => a + (x[k] || 0), 0);
  return `<section class="card hero" aria-label="Session overview">
    <span class="status">● Ended</span>
    <h1>${esc(S.title)}</h1>
    <div class="meta"><span>Today ${clock(S.side[0].at, false)}–${clock(S.end, false)}</span><span title="${esc(S.folder)}">~/code/shop-api</span><span>${esc(S.model)}</span><span title="session ${esc(S.id)}">claude-code</span></div>
    <p class="lead">You sent <b>${plural(turns.length, "prompt")}</b> over <b>${dur(st.clock)}</b>. Claude changed <b>${plural(c.changed, "file")}</b>, ran <b>${plural(commands.length, "command")}</b> and contacted <b>${plural(c.sites, "site")}</b>.${failed.length ? ` <b>${plural(failed.length, "tool call")}</b> failed.` : ""}</p>
    ${items.length ? `<div class="attn"><h2>Worth a look</h2><ul>${items.map(([k, ic, t, s, to]) => `<li class="${k}"><button type="button" data-jump="${to}"><span class="ic" aria-hidden="true">${ic}</span><span><span class="t">${esc(t)}</span><span class="s">${esc(s)}</span></span><span class="go">Show →</span></button></li>`).join("")}</ul></div>` : ""}
    <div class="kpis">
      <div class="kpi"><span class="l">Time</span><span class="v">${dur(st.clock)}</span><span class="s">model ${dur(st.model)} · tools ${dur(st.tool)}</span></div>
      <div class="kpi"><span class="l">Files</span><span class="v">${c.changed} changed</span><span class="s">${c.read} read by Claude's tools</span></div>
      <div class="kpi"><span class="l">Commands</span><span class="v">${commands.length}</span><span class="s">longest: ${esc(longest.input.command)}, ${dur(longest.dur)}</span></div>
      <div class="kpi"><span class="l">Network</span><span class="v">${plural(c.sites, "site")}</span><span class="s">${plural(conns.length, "connection")}, ${conns.filter((e) => e.label === "harness").length} by the harness</span></div>
    </div>
    <div class="foot"><span>Tokens: ${num(sum("in"))} input · ${num(sum("out"))} output · ${num(sum("cw"))} cache write · ${num(sum("cr"))} cache read</span>${G.sideToggle()}</div>
  </section>`;
}

// ---------- centre: turns ----------
function effLi(e) {
  const w = G.effectWhat(e);
  const hint = e.label === "harness" || e.label === "outside" ? G.during(e) : "";
  const body = e.kind === "change" ? G.diffHTML(e) : "";
  return `<li id="eff-${e.id}"><div class="eh">${G.labelBadge(e)}<span>${w.g} ${esc(w.w)} <button type="button" class="linkish" data-open="effect:${e.id}"><code title="${esc(e.kind === "net" ? "" : G.full(e.path))}">${esc(G.effectTarget(e))}</code></button></span><span class="muted small">${esc(G.effectStat(e))}${hint ? ` · ${esc(hint)}` : ""}</span></div>${body ? `<details><summary>${e.diff ? "Show diff" : e.binary ? "About this file" : "Show content"}</summary>${body}</details>` : ""}</li>`;
}
function toolLi(x) {
  const s = G.STATUS(x);
  return `<li><div class="tl${x.ok ? "" : " failed"}" id="tool-${x.id}"><span class="si ${s.w}">${s.g}${x.ok ? "" : " failed"}</span><button type="button" class="linkish nm" data-open="tool:${x.id}">${esc(x.name)}</button>${x.agent ? `<span class="agent">${esc(x.agent)}</span>` : ""}<code>${esc(G.toolArg(x))}</code>${G.lineStat(x) ? `<span class="ls"><span style="color:var(--add)">+${x.add}</span> <span style="color:var(--del)">−${x.del}</span></span>` : ""}<span class="tm">${dur(x.dur)}</span></div>${x.ok ? "" : `<div class="why">${esc(x.result.split("\n")[0])}</div>`}${x.effects.length ? `<ul class="effs">${x.effects.map(effLi).join("")}</ul>` : ""}${x.spawns ? subAgent(x) : ""}</li>`;
}
function subAgent(x) {
  const t = turns[x.turn - 1];
  const cs = t.calls.filter((c) => c.agent === x.spawns);
  return `<div class="sub" role="group" aria-label="Sub-agent ${esc(x.spawns)}"><div class="say">Sub-agent ${esc(x.spawns)} · ${dur(x.dur)} · ${plural(cs.length, "model call")}</div><ol class="steps">${cs.map((c) => step(c, t)).join("")}</ol></div>`;
}
function step(c, t) {
  const mine = t.tools.filter((x) => x.call === c.n);
  const sev = t.several.filter((e) => e.cands.every((id) => tools.get(id).call === c.n));
  const then = mine.length === 0 ? "" : mine.length === 1 ? ", then ran:" : `, then ran ${mine.length} at once:`;
  return `<li class="step"><div class="say"><button type="button" class="linkish cn" data-open="call:${c.n}">#${c.n}</button><span>${c.thinking ? "Thought and wrote" : mine.length ? "Wrote" : "Wrote the answer"} for ${dur(c.dur)}${then}</span>${c.thinking ? `<button type="button" class="linkish" data-open="call:${c.n}">Read the thinking</button>` : ""}</div>${mine.length ? `<ul class="tools">${mine.map(toolLi).join("")}</ul>` : ""}${sev.length ? `<p class="grp" id="sev-${t.n}">◌ Not pinned to one tool: ${esc(sev[0].cands.map((id) => G.toolShort(tools.get(id))).join(" and "))} were running together</p><ul class="effs">${sev.map(effLi).join("")}</ul>` : ""}</li>`;
}
function turnCard(t) {
  const tt = G.turnTime(t), c = G.counts(t.effects), f = t.tools.filter((x) => !x.ok).length;
  const pills = [`${plural(t.tools.length, "tool call")}`, c.changed && `${plural(c.changed, "file")} changed`, c.read && `${c.read} read`, c.sites && plural(c.sites, "site")].filter(Boolean)
    .map((p) => `<span class="pill">${esc(p)}</span>`).join("") + (f ? `<span class="pill bad">✗ ${f} failed</span>` : "");
  const steps = t.hooksOnly
    ? `<ol class="steps"><li class="step"><div class="say">No model calls captured. The hooks saw:</div><ul class="tools">${t.tools.map(toolLi).join("")}</ul></li></ol>`
    : `<ol class="steps">${t.calls.filter((c) => !c.agent).map((c) => step(c, t)).join("")}</ol>`;
  const loose = t.unpinned.length ? `<p class="grp">○ Not caused by a tool call</p><ul class="effs">${t.unpinned.map(effLi).join("")}</ul>` : "";
  return `<article class="card turn" id="turn-${t.n}" aria-labelledby="h-${t.n}">
    <header class="th"><div class="k"><button type="button" class="linkish" data-open="turn:${t.n}">Turn ${t.n}</button><span>${clock(t.at)}</span></div>
      <div class="dur">${t.hooksOnly ? `<b>—</b><span>no model calls captured</span>` : `<b>${dur(tt.clock)}</b><span>model ${dur(tt.model)} · tools ${dur(tt.tool)}</span>`}</div>
      <h2 id="h-${t.n}">${esc(t.prompt)}</h2></header>
    <div class="tb"><div class="sum">${pills}</div>${steps}${loose}${t.answer ? `<div class="answer"><span class="who">Claude answered</span>${esc(t.answer)}</div>` : ""}</div></article>`;
}
document.getElementById("main").innerHTML = overview() + turns.map((t) => {
  const b = S.between.find((x) => x.after === t.n);
  return turnCard(t) + (b ? `<section class="card btwentry" id="between-${t.n}" aria-label="Between turns"><h2>Between turns ${t.n} and ${t.n + 1} · ${clock(b.effects[0].at)}</h2><p class="muted small" style="margin:0">A change while no tool call was running: most likely your own edit.</p><ul class="effs">${b.effects.map(effLi).join("")}</ul></section>` : "");
}).join("");

// ---------- behaviour ----------
function jump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  const d = el.querySelector(":scope > details");
  if (d) d.open = true;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  const f = el.querySelector("button, a");
  if (f) f.focus({ preventScroll: true });
}
const dlg = document.getElementById("dlg");
let opener = null;
document.body.addEventListener("click", (ev) => {
  const j = ev.target.closest("[data-jump]");
  if (j) { jump(j.dataset.jump); return; }
  const pd = ev.target.closest(".pd");
  if (pd) {
    const box = pd.nextElementSibling;
    box.hidden = !box.hidden;
    pd.setAttribute("aria-expanded", String(!box.hidden));
    pd.textContent = box.hidden ? pd.dataset.label : "Hide";
    return;
  }
  const o = ev.target.closest("[data-open]");
  if (o && !o.closest("dialog")) {
    opener = o;
    const [k, id] = o.dataset.open.split(":");
    document.getElementById("dbody").innerHTML = G.detail(k, id);
    dlg.showModal();
  }
});
document.getElementById("dclose").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", () => { if (opener && opener.isConnected) opener.focus(); });
const io = new IntersectionObserver((xs) => {
  for (const x of xs) if (x.isIntersecting) document.querySelectorAll(".toc a[data-turn]").forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === `#${x.target.id}`)));
}, { rootMargin: "-25% 0px -65% 0px" });
document.querySelectorAll(".turn").forEach((e) => io.observe(e));
G.themeInit();
</script>
</body>
</html>
