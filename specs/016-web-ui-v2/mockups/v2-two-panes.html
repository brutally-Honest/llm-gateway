<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>016 mockup 2 · Two panes</title>
<style>
/* 016 mockups: shared tokens and parts. Every text colour pair below is ≥ 4.5:1 on its
   background in both themes; status is always glyph + word, colour only repeats it. */
:root, :root[data-theme=dark] {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #3d444d; --line: #262c34;
  --text: #c9d1d9; --hi: #e6edf3; --muted: #9198a1; --accent: #58a6ff; --accent-bg: #0c2d4b;
  --ok: #3fb950; --bad: #ff7b72; --bad-bg: #2d1214; --warn: #d29922;
  --add: #56d364; --add-bg: #12261e; --del: #ffa198; --del-bg: #2d1214;
  --model: #79c0ff; --model-bg: #0c2d4b; --toolc: #d2a8ff; --tool-bg: #2a1e3d;
  --scrim: #010409b3;
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #ffffff; --panel: #f6f8fa; --panel2: #eef1f4; --border: #c8d1da; --line: #e1e6eb;
  --text: #24292f; --hi: #1f2328; --muted: #57606a; --accent: #0969da; --accent-bg: #ddf4ff;
  --ok: #1a7f37; --bad: #cf222e; --bad-bg: #ffebe9; --warn: #9a6700;
  --add: #1a7f37; --add-bg: #dafbe1; --del: #b3261e; --del-bg: #ffebe9;
  --model: #0550ae; --model-bg: #ddf4ff; --toolc: #6e40c9; --tool-bg: #f1e9ff;
  --scrim: #1f232866;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: 12.5px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--hi); text-decoration: none; }
.crumb { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 13px; color: var(--muted); }
.crumb b { color: var(--hi); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40ch; }
.vname { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 4px; padding: 0 6px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); min-height: 28px; }
.seg button[aria-pressed=true] { background: var(--accent-bg); color: var(--hi); font-weight: 600; }

/* session header */
.shead { display: flex; flex-direction: column; gap: 8px; }
.shead h1 { margin: 0; font-size: 20px; color: var(--hi); font-weight: 600; }
.meta { margin: 0; font-size: 12px; color: var(--muted); }
.facts-groups { display: flex; flex-wrap: wrap; gap: 8px; }
.fg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; }
.fgname { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fact { color: var(--muted); white-space: nowrap; }
.fact b { color: var(--hi); font-weight: 600; font-variant-numeric: tabular-nums; }
.facts-groups.compact .fg { padding: 4px 8px; }
details.side { font-size: 12px; color: var(--muted); }
details.side summary { cursor: pointer; display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; }
details.side summary:hover { color: var(--text); }
details.side ul { margin: 6px 0 2px; }

/* labels, statuses */
.lbl { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--hi); background: var(--panel2); }
.lbl-named { border-color: var(--ok); }
.lbl-only_one { border-color: var(--accent); }
.lbl-several { border-style: dashed; }
.lbl-outside { border-color: var(--warn); }
.lbl-harness { color: var(--muted); }
.st { white-space: nowrap; font-weight: 600; }
.st-ok { color: var(--ok); }
.st-failed { color: var(--bad); }
.errbox { border-left: 3px solid var(--bad); padding-left: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }
ul.plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }

/* rail prompts: clamped to 3 lines, full text on hover or focus */
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.clamp2 { -webkit-line-clamp: 2; line-clamp: 2; }
:is(a, button, li, div):is(:hover, :focus, :focus-within) > .clamp { -webkit-line-clamp: unset; line-clamp: unset; }

/* details view parts */
.dhead { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 15px; color: var(--hi); font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.kicker { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dsec { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dsec h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 12.5px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; color: var(--hi); overflow-wrap: anywhere; }
pre { margin: 0; font-size: 12px; color: var(--hi); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto; }
.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.diff div { padding: 1px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .dg { display: inline-block; width: 1.2em; color: var(--muted); }
.diff .ctx { color: var(--muted); }
.diff .add { color: var(--hi); background: var(--add-bg); }
.diff .add .dg { color: var(--add); }
.diff .del { color: var(--hi); background: var(--del-bg); }
.diff .del .dg { color: var(--del); }
.fileblock { display: flex; flex-direction: column; gap: 6px; }
.fileblock p { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
ul.elist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
ul.elist li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
ul.elist .elbl { min-width: 11.5rem; }
ul.elist code { overflow-wrap: anywhere; }
details.think summary { cursor: pointer; color: var(--accent); }
details.think pre { margin-top: 6px; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }

@media (max-width: 760px) {
  .crumb b { max-width: 20ch; }
}

/* ---- variant 2: timeline left, details always open on the right ---- */
.layout { display: grid; grid-template-columns: 14rem minmax(0, 1fr) minmax(24rem, 34rem); height: calc(100vh - 45px - 32px); }
.layout > * { overflow: auto; min-width: 0; }
.rail { padding: 12px 8px 12px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.rail h2, .pane-empty h2 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ritem { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 5px 8px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
.ritem:hover { background: var(--panel); }
.ritem[aria-current=true] { border-left-color: var(--accent); background: var(--panel); }
.ritem .p { color: var(--hi); font-size: 12.5px; }
.ritem .m { font-size: 11px; color: var(--muted); }
.ritem .err { color: var(--bad); font-weight: 600; }
.timeline { padding: 14px 18px 30px; display: flex; flex-direction: column; gap: 12px; }
.timeline > * { flex: none; }
.pane { border-left: 1px solid var(--border); background: var(--panel); }
.pane-empty { padding: 18px; color: var(--muted); }
.strip { display: flex; gap: 2px; align-items: flex-end; height: 34px; padding: 2px 0; overflow-x: auto; }
.strip button { display: block; align-self: flex-end; box-sizing: border-box; flex: none; border: 0; padding: 0; cursor: pointer; background: var(--model); border-radius: 2px; min-width: 6px; }
.strip button.side { background: var(--border); }
.strip button.ag { background: var(--toolc); }
.strip button.ts { margin-left: 8px; }
.strip button[aria-pressed=true] { outline: 2px solid var(--hi); outline-offset: 1px; }
.stripcap { font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.turn { border-top: 2px solid var(--line); padding-top: 8px; scroll-margin-top: 10px; }
.turn[aria-current=true] { border-top-color: var(--accent); }
.th { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; font-size: 12px; color: var(--muted); }
.th .tn { font-weight: 600; font-size: 13px; }
.th .cnt { margin-left: auto; color: var(--text); }
.prompt { margin: 6px 0; color: var(--hi); font-size: 14px; }
.calls { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--muted); align-items: center; margin-bottom: 4px; }
.cchip { border: 1px solid var(--line); border-radius: 4px; background: none; padding: 0 6px; cursor: pointer; color: var(--model); font-size: 12px; }
.cchip.ag { color: var(--toolc); }
[aria-selected=true].cchip, .sel[aria-selected=true] { background: var(--accent-bg); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: 2.6rem 11.5rem minmax(0, 1fr) auto; font-size: 13px; }
.grid > .r { display: contents; }
.sel { all: unset; display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; gap: 0 10px; align-items: baseline; padding: 3px 6px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.sel:hover { background: var(--panel); }
.sel:focus-visible { outline: 2px solid var(--accent); }
.sel .no { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
.tool .what { display: flex; gap: 8px; align-items: baseline; }
.tool .nm { color: var(--hi); font-weight: 600; }
.tool .arg { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .tm { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.tool.failed .no::after { content: " ✗"; color: var(--bad); }
.eff { font-size: 12.5px; }
.eff .lblcell { grid-column: 2; }
.eff .tgt { display: flex; gap: 8px; min-width: 0; }
.eff code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eff .st2 { font-size: 11.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.ind1 .what, .ind1 .tgt { padding-left: 18px; }
.ind2 .tgt, .ind2 .what { padding-left: 36px; }
.grp { grid-column: 2 / -1; font-size: 12px; color: var(--muted); padding: 4px 6px 0; font-style: italic; }
.agent { font-size: 11px; color: var(--toolc); border: 1px solid var(--toolc); border-radius: 4px; padding: 0 4px; }
.ans { margin: 6px 0 0 3.2rem; font-size: 13px; color: var(--text); border-left: 2px solid var(--line); padding-left: 10px; }
.ans .clamp { -webkit-line-clamp: 2; }
.hooksonly { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.between { border: 1px dashed var(--warn); border-radius: 6px; padding: 6px 8px; }
.between p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
.keys { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding: 0 16px; background: var(--panel2); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.keys b { color: var(--hi); }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--hi); }
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr) minmax(20rem, 28rem); }
  .rail { display: none; }
}
@media (max-width: 760px) {
  .layout { display: block; height: auto; }
  .pane { border-left: 0; border-top: 2px solid var(--accent); }
  .grid { grid-template-columns: 2.2rem minmax(0, 1fr) auto; }
  .eff .lblcell { grid-column: 2 / -1; }
}
</style>
</head>
<body>
<div id="top"></div>
<div class="layout">
  <nav class="rail" aria-label="Turns" id="rail"></nav>
  <main class="timeline" id="main"></main>
  <aside class="pane" id="pane" aria-label="Details" aria-live="polite" tabindex="-1"></aside>
</div>
<footer class="keys" aria-label="Keyboard shortcuts"><b>SESSION</b><span id="pos"></span><span><kbd>↑</kbd>/<kbd>↓</kbd> select row</span><span><kbd>j</kbd>/<kbd>k</kbd> turn</span><span><kbd>→</kbd> into details</span><span><kbd>e</kbd> next error</span></footer>
<script>// 016 mockups: the shared made-up dataset and helpers. build.py inlines this file into
// every variant, so all of them show the same session. Times are seconds from T0.
"use strict";
const G = (() => {
const T0 = new Date(2026, 10, 10, 10, 2, 0).getTime();
const FOLDER = "/home/dev/code/shop-api";

// ---------- the session ----------
const S = {
  id: "7f3c91e2-5b0a-4d1e-9c55-2a8e61f0b7d4",
  client: "claude-code", model: "claude-opus-5-5", folder: FOLDER,
  title: "Fix flaky checkout tests", titleFrom: "generated title (#3)",
  ended: true,
  unassigned: [{ host: "downloads.claude.ai", port: 443, at: 1180, dur: 2.1, up: 1200, down: 4_812_000, outcome: "ok", label: "harness", client: "claude-code" }],
};

// side calls: the client's own calls, never a turn, never red by default
S.side = [
  { n: 1, kind: "quota probe", at: -4, dur: 0.3, status: 429, statusText: "429 rate limited — expected answer to a quota probe", in: 8, out: 0, cr: 0, cw: 0 },
  { n: 3, kind: "title generation", at: 0.6, dur: 1.4, status: 200, statusText: "200 ok", in: 212, out: 9, cr: 0, cw: 0, response: "Fix flaky checkout tests" },
];

const turns = [];
let tid = 0, eid = 0;
const call = (n, at, dur, tok, extra = {}) => ({ n, at, dur, ...tok, ...extra });
const tok = (inp, out, cw, cr) => ({ in: inp, out, cw, cr });
const tool = (t) => ({ id: `t${++tid}`, ok: true, ...t });
const eff = (e) => ({ id: ++eid, ...e });

// Turn 1: a 2+ minute Bash with harness traffic during it, reasoning on #2
turns.push({
  n: 1, at: 0, end: 152.9,
  prompt: "Run the test suite and tell me what's failing. The checkout tests have been flaky all week and I'd like to know whether it's the retry logic or the fixtures before I touch anything.",
  calls: [
    call(2, 0.5, 6.2, tok(1820, 312, 16400, 0), { stop: "tool_use", thinking: "The user wants the failing tests first. Running the whole suite is slow (about two minutes on this repo, judging by the jest config with --runInBand) but it's the only way to see the flaky ones together. I'll run npm test and read the summary rather than guessing from the file names." }),
    call(4, 141.6, 11.3, tok(2410, 486, 3100, 16400), { stop: "end_turn" }),
  ],
  tools: [
    tool({ call: 2, name: "Bash", at: 7.0, dur: 134.2, input: { command: "npm test", description: "Run the full test suite" },
      result: "> shop-api@2.4.0 test\n> jest --runInBand\n\nPASS test/cart.test.js\nPASS test/users.test.js\nFAIL test/checkout.test.js\n  ● checkout › retries a declined card once\n    expected charge count 1, got 2\nFAIL test/payment.test.js (2 failed)\n\nTests: 3 failed, 118 passed, 121 total\nTime: 133.8 s" }),
  ],
  answer: "3 tests fail, all on retries: the payment client sends a second charge when the first times out, because the retry builds a new idempotency key. The fixtures look fine.",
});
turns[0].effects = [
  eff({ kind: "net", host: "registry.npmjs.org", port: 443, at: 9.2, dur: 0.8, up: 2100, down: 18_400, outcome: "ok", label: "only_one", tool: "t1" }),
  eff({ kind: "net", host: "statsig.anthropic.com", port: 443, at: 41.0, dur: 0.4, up: 3800, down: 600, outcome: "ok", label: "harness" }),
  eff({ kind: "change", path: "test-results.xml", change: "created", size: 14_820, at: 141.4, label: "only_one", tool: "t1", content: "<?xml version=\"1.0\"?>\n<testsuites tests=\"121\" failures=\"3\" time=\"133.8\">\n  <testsuite name=\"checkout\" failures=\"1\">…" }),
];

// Turn 2: parallel reads plus a sub-agent
turns.push({
  n: 2, at: 240, end: 302.5,
  prompt: "Read the checkout test and the payment client and find out why a retry double-charges.",
  calls: [
    call(5, 240.4, 4.8, tok(980, 274, 2900, 19500), { stop: "tool_use" }),
    call(6, 246.0, 3.1, tok(1400, 120, 6200, 0), { stop: "tool_use", agent: "Explore" }),
    call(7, 249.6, 4.0, tok(820, 96, 2100, 6200), { stop: "tool_use", agent: "Explore" }),
    call(8, 254.1, 29.0, tok(640, 1210, 1800, 8300), { stop: "end_turn", agent: "Explore" }),
    call(9, 284.0, 18.5, tok(3100, 702, 4800, 22400), { stop: "end_turn" }),
  ],
  answer: "Found it: retry.js calls makeKey() inside the retry loop, so each attempt gets a fresh idempotency key and Stripe treats it as a new charge. The test is right; the client is wrong.",
});
turns[1].tools = [
  tool({ call: 5, name: "Read", at: 245.4, dur: 0.1, input: { file_path: `${FOLDER}/src/checkout.js` }, result: "1  import { charge } from './payment/client.js'\n2  …\n(212 lines)" }),
  tool({ call: 5, name: "Read", at: 245.4, dur: 0.1, input: { file_path: `${FOLDER}/test/checkout.test.js` }, result: "1  import { checkout } from '../src/checkout.js'\n…\n(148 lines)" }),
  tool({ call: 5, name: "Grep", at: 245.5, dur: 0.3, input: { pattern: "retry", path: "src/" }, result: "src/payment/client.js:41\nsrc/payment/retry.js:3\nsrc/payment/retry.js:18\nsrc/checkout.js:77" }),
  tool({ call: 5, name: "Bash", at: 245.4, dur: 0.1, input: { command: "ls -la src/payment", description: "List the payment folder" }, result: "client.js  keys.js  retry.js" }),
  tool({ call: 5, name: "Bash", at: 245.4, dur: 0.1, input: { command: "cat src/payment/keys.js", description: "Show the key helper" }, result: "export const makeKey = (order) => `${order.id}-${randomUUID()}`" }),
  tool({ call: 5, name: "Agent", at: 245.4, dur: 38.2, input: { description: "Explore payment client", subagent_type: "Explore", prompt: "Map how src/payment builds and reuses idempotency keys." }, result: "client.js builds a key per charge(); retry.js wraps charge() and calls makeKey() on every attempt (line 18)." , spawns: "Explore" }),
  tool({ call: 6, agent: "Explore", name: "Read", at: 249.3, dur: 0.1, input: { file_path: `${FOLDER}/src/payment/client.js` }, result: "(96 lines)" }),
  tool({ call: 6, agent: "Explore", name: "Glob", at: 249.3, dur: 0.1, input: { pattern: "src/payment/**" }, result: "src/payment/client.js\nsrc/payment/retry.js\nsrc/payment/keys.js" }),
  tool({ call: 7, agent: "Explore", name: "Read", at: 253.8, dur: 0.1, input: { file_path: `${FOLDER}/src/payment/retry.js` }, result: "(41 lines)" }),
];
const [r1, r2, g1, , , , r3, gl, r4] = turns[1].tools;
turns[1].effects = [
  eff({ kind: "read", path: "src/checkout.js", detail: "lines 1–212", at: 245.5, label: "named", tool: r1.id }),
  eff({ kind: "read", path: "test/checkout.test.js", detail: "lines 1–148", at: 245.5, label: "named", tool: r2.id }),
  eff({ kind: "read", search: true, path: "src/", detail: "pattern “retry”", at: 245.8, label: "named", tool: g1.id }),
  eff({ kind: "read", path: "src/payment/client.js", detail: "lines 1–96", at: 249.4, label: "named", tool: r3.id }),
  eff({ kind: "read", search: true, path: "src/payment/", detail: "pattern src/payment/**", at: 249.4, label: "named", tool: gl.id }),
  eff({ kind: "read", path: "src/payment/retry.js", detail: "lines 1–41", at: 253.9, label: "named", tool: r4.id }),
];

// Turn 3: an errored Edit, then two Edits in parallel
turns.push({
  n: 3, at: 400, end: 431.5,
  prompt: "Fix the retry so it reuses the idempotency key from the first attempt.",

// union length of [start, end] spans
function union(spans) {
  const s = spans.filter((x) => x[1] > x[0]).sort((a, b) => a[0] - b[0]);

  const files = t.effects.filter((e) => e.kind !== "net"), nets = t.effects.filter((e) => e.kind === "net");
  return `<header class="dhead"><p class="kicker">Tool call · turn ${t.turn}${t.agent ? ` · sub-agent ${esc(t.agent)}` : ""}</p><h2><span class="st st-${s.w}">${s.g} ${s.w}</span> ${esc(t.name)} <span class="muted">${esc(toolArg(t))}</span></h2></header>`
    + sec("Timings", dl([["asked by", c ? `model call #${c.n}${c.agent ? ` (${esc(c.agent)})` : ""}` : "no model call captured (seen by hooks only)"], ["started", clock(t.at)], ["ended", clock(t.at + t.dur)], ["run time", dur(t.dur)], t.spawns && ["note", "spawns a sub-agent: never an effect's candidate, and its span is not counted as tool time"]]))
    + sec("Input", json(t.input))
    + sec("Result", `<div class="${t.ok ? "" : "errbox"}">${t.ok ? "" : `<p class="st st-failed">✗ failed</p>`}${pre(t.result)}</div>`)
    + sec(`Files (${files.length})`, files.length ? files.map((e) => `<div class="fileblock"><p>${labelBadge(e)} ${effectWhat(e).g} ${esc(effectWhat(e).w)} <code title="${esc(full(e.path))}">${esc(e.path)}</code> <span class="muted">${esc(effectStat(e))}</span></p>${e.kind === "change" ? diffHTML(e) : ""}</div>`).join("") : `<p class="muted">No file changes or reads attributed to this call.</p>`)
    + sec(`Connections (${nets.length})`, nets.length ? effList(nets) : `<p class="muted">No connections attributed to this call.</p>`);
}
function detailCall(c) {
  const ctx = c.in + c.cw + c.cr;
  const prev = [...calls.values()].filter((x) => !x.side && !x.agent === !c.agent && x.n < c.n).pop();
  const prevCtx = prev ? prev.in + prev.cw + prev.cr : null;
  const asked = [...tools.values()].filter((t) => t.call === c.n);
  return `<header class="dhead"><p class="kicker">Model call${c.side ? " · side call" : ""}${c.agent ? ` · sub-agent ${esc(c.agent)}` : ""}${c.turn ? ` · turn ${c.turn}` : ""}</p><h2>#${c.n} <span class="muted">${esc(S.model)}</span></h2></header>`
    + sec("Timings", dl([["started", clock(c.at)], ["duration", dur(c.dur)], ["stop reason", esc(c.stop || (c.side ? c.statusText : "—"))]]))
    + sec("Tokens", dl([["input", num(c.in)], ["output", num(c.out)], ["cache write", num(c.cw)], ["cache read", num(c.cr)], ["context size", `${num(ctx)} <span class="muted">(input + cache write + cache read)</span>`], ["change since previous call", prevCtx == null ? "first call of its thread" : `${ctx >= prevCtx ? "+" : "−"}${num(Math.abs(ctx - prevCtx))}`]]))
    + (c.thinking ? sec("Thinking", `<details class="think"><summary>Show thinking (${num(Math.round(c.thinking.length / 4))} tokens)</summary>${pre(c.thinking)}</details>`) : "")
    + (asked.length ? sec(`Tools asked (${asked.length})`, `<ul class="plain">${asked.map((t) => `<li>${STATUS(t).g} ${esc(t.name)} <span class="muted">${esc(toolArg(t))}</span></li>`).join("")}</ul>`) : "")
    + (c.response ? sec("Response", pre(c.response)) : "")
    + sec("Raw", `<p><a href="#" onclick="return false">request</a> · <a href="#" onclick="return false">response stream</a> · <a href="#" onclick="return false">headers</a> <span class="muted">(mock links)</span></p>`);
}
function detailTurn(t) {
  const tt = turnTime(t), c = counts(t.effects);
  return `<header class="dhead"><p class="kicker">Turn ${t.n} · ${clock(t.at)}</p><h2>${esc(t.prompt)}</h2></header>`
    + sec("Time", t.hooksOnly ? `<p>No model calls captured. Tool time ${dur(tt.tool)}.</p>` : dl([["prompt to final answer", dur(tt.clock)], ["model time", dur(tt.model)], ["tool time", dur(tt.tool)], ["waiting", dur(tt.wait)]]))
    + sec("Calls", t.calls.length ? `<p>${t.calls.map((x) => `#${x.n}${x.agent ? ` (${esc(x.agent)})` : ""} ${dur(x.dur)}`).join(" · ")}</p>` : `<p class="muted">no model calls captured</p>`)
    + sec(`Effects · ${countsText(c)}`, effList(t.effects))
    + (t.answer ? sec("Final answer", pre(t.answer)) : "");
}
function detailSide(s) {
  return detailCall(calls.get(s.n));
}
function detail(kind, id) {
  if (kind === "tool") return detailTool(tools.get(id));
  if (kind === "call") return detailCall(calls.get(+id));
  if (kind === "effect") return detailEffect(effects.get(+id));
  if (kind === "turn") return detailTurn(turns[+id - 1]);
  return "";
}

// walk is a turn's rows in reading order: each model call, the tools it asked for with
// their effects beneath, a sub-agent's calls under its Agent tool, a "several running"
// group after the parallel tools it names, effects no tool caused, then the answer.
// A call and its tools share a depth; effects and sub-agent rows are one deeper.
function walk(t) {
  const out = [];
  const asked = (c) => t.tools.filter((x) => x.call === c.n);
  const emitTool = (x, d) => {
    out.push({ type: "tool", t: x, depth: d });
    for (const e of x.effects) out.push({ type: "effect", e, depth: d + 1 });
    if (x.spawns) for (const c of t.calls.filter((c) => c.agent === x.spawns)) emitCall(c, d + 1);
  };
  const emitCall = (c, d) => {
    out.push({ type: "call", c, depth: d });
    const mine = asked(c);
    for (const x of mine) emitTool(x, d);
    const sev = t.several.filter((e) => e.cands.every((id) => tools.get(id).call === c.n));
    if (sev.length) {
      out.push({ type: "group", kind: "several", depth: d, effects: sev, title: `not pinned to one tool: ${sev[0].cands.map((id) => toolShort(tools.get(id))).join(" and ")} were running` });
      for (const e of sev) out.push({ type: "effect", e, depth: d + 1 });
    }
  };
  if (t.hooksOnly) {
    out.push({ type: "note", text: "no model calls captured", depth: 0 });
    for (const x of t.tools) emitTool(x, 0);
  }
  for (const c of t.calls.filter((c) => !c.agent)) emitCall(c, 0);
  if (t.unpinned.length) {
    out.push({ type: "group", kind: "loose", depth: 0, effects: t.unpinned, title: "not caused by a tool call" });
    for (const e of t.unpinned) out.push({ type: "effect", e, depth: 1 });
  }
  if (t.answer) out.push({ type: "answer", text: t.answer, depth: 0 });
  return out;
}
// during says which tool was running when an effect happened, for loose effects
function during(e) {
  const run = [...tools.values()].filter((x) => !x.spawns && x.at <= e.at && e.at <= x.at + x.dur);
  return run.length ? `during ${run.map(toolRef).join(", ")}` : "";
}

// ---------- shared chrome ----------
function themeInit() {
  let t = "dark";
  try { t = localStorage.getItem("gw016-theme") || "dark"; } catch {}
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("[data-theme-btn]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t));
    b.addEventListener("click", () => {
      document.documentElement.dataset.theme = b.dataset.themeBtn;
      try { localStorage.setItem("gw016-theme", b.dataset.themeBtn); } catch {}
      document.querySelectorAll("[data-theme-btn]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    });
  });
}
function themeButtons() {
  return `<div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-btn="dark">☾ Dark</button><button type="button" data-theme-btn="light">☀ Light</button></div>`;
}
function topbar(variantName) {
  return `<header class="top"><a class="brand" href="index.html">Gateway</a><nav class="crumb" aria-label="Breadcrumb"><a href="sessions.html">Sessions</a><span aria-hidden="true">/</span><b title="${esc(S.title)}">${esc(S.title)}</b></nav><span class="vname">${esc(variantName)}</span><span class="spacer"></span>${themeButtons()}</header>`;
}
function sideToggle() {
  return `<details class="side"><summary>${plural(S.side.length, "side call")}</summary><ul class="plain">${S.side.map((s) => `<li><button type="button" class="linkish" data-open="call:${s.n}">#${s.n} ${esc(s.kind)}</button> <span class="muted">${clock(s.at)} · ${dur(s.dur)} · ${esc(s.statusText)}</span></li>`).join("")}</ul><p class="muted small">The client's own calls. Never a turn, never counted as an error.</p></details>`;
}
function headerFacts(compact = false) {
  const f = sessionFacts();
  return `<div class="facts-groups${compact ? " compact" : ""}">${f.groups.map(([g, rows]) => `<div class="fg"><span class="fgname">${esc(g)}</span>${rows.map(([k, v]) => `<span class="fact"><b>${esc(v)}</b> ${esc(k)}</span>`).join("")}</div>`).join("")}</div>`;
}
function sessionMeta() {
  const f = sessionFacts();
  return `<p class="meta"><span title="${esc(S.id)}">claude-code</span> · ${esc(S.model)} · <span title="${esc(S.folder)}">~/code/shop-api</span> · ${f.started}–${f.ended} · ended · title from ${esc(S.titleFrom)}</p>`;
}
function unassignedNote() {
  const u = S.unassigned[0];
  return `<p class="muted small">Not in this session: <a href="sessions.html#unassigned">1 unassigned connection</a> at ${clock(u.at)}, after it ended (⚙ harness · ${esc(u.client)} · ${esc(u.host)}).</p>`;
}
function turnTimeText(t) {
  if (t.hooksOnly) return "no model calls captured";
  const x = turnTime(t);
  return `${dur(x.clock)} · model ${dur(x.model)} · tools ${dur(x.tool)}`;
}
function railMeta(t) {
  const c = counts(t.effects);
  return `${t.hooksOnly ? "hooks only" : dur(t.end - t.at)} · ${plural(t.tools.length, "tool")} · ${countsText(c)}`;
}

return { S, T0, FOLDER, turns, tools, calls, effects, clock, dur, num, bytes, esc, rel, full, union, turnTime, sessionTime, counts, countsText, plural,
  LABELS, CHANGE, STATUS, toolArg, lineStat, toolNo, toolRef, toolShort, labelTools, effectTarget, effectWhat, effectStat, labelBadge, diffHTML,
  walk, during, detail, detailTurn, detailTool, detailCall, detailEffect, effList, sessionFacts, themeInit, themeButtons, topbar, sideToggle, headerFacts, sessionMeta, unassignedNote, turnTimeText, railMeta, pre, dl };
})();
</script>
<script>
"use strict";
const { S, turns, calls, esc, dur, clock, plural } = G;
document.getElementById("top").innerHTML = G.topbar("mockup 2 · two panes");

document.getElementById("rail").innerHTML = `<h2>Turns</h2>` + turns.map((t) => {
  const fails = t.tools.filter((x) => !x.ok).length;
  return `<button type="button" class="ritem" data-turn="${t.n}" title="${esc(t.prompt)}"><span class="p clamp clamp2">${t.n}. ${esc(t.prompt)}</span><span class="m">${esc(G.railMeta(t))}${fails ? ` · <span class="err">✗ ${fails} failed</span>` : ""}</span></button>`;
}).join("");

// the call strip: one bar per model call, width by duration, turns marked by a gap
function strip() {
  const all = [...calls.values()].sort((a, b) => a.at - b.at);
  let lastTurn = null;
  return `<div class="strip" role="group" aria-label="Model calls by duration">${all.map((c) => {
    const w = Math.max(6, Math.round(Math.sqrt(c.dur) * 9));
    const ts = c.turn && c.turn !== lastTurn; if (c.turn) lastTurn = c.turn;
    const name = c.side ? `#${c.n} side call: ${c.kind}, ${dur(c.dur)}, ${c.statusText}` : `#${c.n}${c.agent ? ` (${c.agent})` : ""} · turn ${c.turn} · ${dur(c.dur)}`;
    return `<button type="button" class="${c.side ? "side" : c.agent ? "ag" : ""}${ts ? " ts" : ""}" style="width:${w}px;height:${c.side ? 14 : 28}px" data-sel="call:${c.n}" title="${esc(name)}" aria-label="${esc(name)}"></button>`;
  }).join("")}</div><div class="stripcap"><span><i class="sw" style="background:var(--model)"></i>main thread</span><span><i class="sw" style="background:var(--toolc)"></i>sub-agent</span><span><i class="sw" style="background:var(--border)"></i>side call (short bar)</span><span>gap = new turn · width = duration</span></div>`;
}

function effRow(e, d) {
  const w = G.effectWhat(e);
  const hint = e.label === "harness" || e.label === "outside" ? G.during(e) : "";
  return `<button type="button" class="sel eff ind${d}" data-sel="effect:${e.id}" aria-selected="false"><span></span><span class="lblcell">${G.labelBadge(e)}</span><span class="tgt"><span>${w.g} ${esc(w.w)}</span><code title="${esc(e.kind === "net" ? "" : G.full(e.path))}">${esc(G.effectTarget(e))}</code></span><span class="st2">${esc(G.effectStat(e))}${hint ? ` · ${esc(hint)}` : ""}</span></button>`;
}
function rows(t) {
  // tools carry their own #n; model calls sit in the chip line above
  return G.walk(t).map((it) => {
    const d = Math.min(2, it.depth);
    if (it.type === "tool") {
      const x = it.t, s = G.STATUS(x);
      return `<button type="button" class="sel tool ind${d}${x.ok ? "" : " failed"}" data-sel="tool:${x.id}" aria-selected="false"><span class="no">${esc(G.toolNo(x))}</span><span class="what" style="grid-column:2/4"><span class="st st-${s.w}">${s.g}${x.ok ? "" : " failed"}</span><span class="nm">${esc(x.name)}</span>${x.agent ? `<span class="agent">${esc(x.agent)}</span>` : ""}<span class="arg">${esc(G.toolArg(x))}</span>${G.lineStat(x) ? `<span class="mono small">${G.lineStat(x)}</span>` : ""}</span><span class="tm">${dur(x.dur)}</span></button>`;
    }
    if (it.type === "effect") return effRow(it.e, d);
    if (it.type === "group") return `<div class="grp">${it.kind === "several" ? "◌" : "○"} ${esc(it.title)}</div>`;
    return "";
  }).join("");
}
function turnHTML(t) {
  const c = G.counts(t.effects);
  const callChips = t.calls.map((x) => `<button type="button" class="cchip${x.agent ? " ag" : ""}" data-sel="call:${x.n}" aria-selected="false" title="model call #${x.n}${x.agent ? ` in sub-agent ${x.agent}` : ""}">#${x.n} ${dur(x.dur)}${x.thinking ? " · thinking" : ""}</button>`).join("");
  return `<section class="turn" id="turn-${t.n}" aria-labelledby="th-${t.n}">
    <div class="th"><button type="button" class="linkish tn" id="th-${t.n}" data-sel="turn:${t.n}">Turn ${t.n}</button><span>${clock(t.at)}</span><span>${esc(G.turnTimeText(t))}</span><span class="cnt">${plural(t.tools.length, "tool call")} · ${esc(G.countsText(c))}</span></div>
    <p class="prompt">${esc(t.prompt)}</p>
    ${t.hooksOnly ? `<p class="hooksonly">no model calls captured · tools seen by hooks only, no #n</p>` : `<div class="calls"><span>model calls</span>${callChips}</div>`}
    <div class="grid">${rows(t)}</div>
    ${t.answer ? `<button type="button" class="linkish ans" data-sel="turn:${t.n}" style="color:var(--text)"><span class="clamp">${esc(t.answer)}</span></button>` : ""}
  </section>`;
}
const main = document.getElementById("main");
main.innerHTML = `<section class="shead" aria-label="Session"><h1>${esc(S.title)}</h1>${G.sessionMeta()}${G.headerFacts(true)}<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">${G.sideToggle()}</div>${G.unassignedNote()}</section>${strip()}`
  + turns.map((t) => {
    const b = S.between.find((x) => x.after === t.n);
    return turnHTML(t) + (b ? `<section class="between" aria-label="Between turns"><p>Between turns ${t.n} and ${t.n + 1}: no tool call was running</p><div class="grid">${b.effects.map((e) => effRow(e, 0)).join("")}</div></section>` : "");
  }).join("");

// selection drives the details pane
const pane = document.getElementById("pane");
let selKey = null;
function select(key, focus = false) {
  selKey = key;
  document.querySelectorAll("[aria-selected]").forEach((n) => n.setAttribute("aria-selected", String(n.dataset.sel === key)));
  document.querySelectorAll(".strip button").forEach((n) => n.setAttribute("aria-pressed", String(n.dataset.sel === key)));
  const [k, id] = key.split(":");
  pane.innerHTML = G.detail(k, id);
  pane.scrollTop = 0;
  const node = main.querySelector(`[data-sel="${CSS.escape(key)}"]`);
  const t = node && node.closest(".turn");
  if (t) markTurn(+t.id.slice(5), false);
  if (focus && node) { node.focus(); node.scrollIntoView({ block: "nearest" }); }
  document.getElementById("pos").textContent = `${k} ${id.replace(/^t/, "")}`;
}
document.body.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-sel]");
  if (b && !b.closest(".pane")) select(b.dataset.sel);
  const r = ev.target.closest("[data-turn]");
  if (r) { markTurn(+r.dataset.turn, true); }
  const o = ev.target.closest("[data-open]");
  if (o) select(o.dataset.open);
});
let cur = 1;
function markTurn(n, scroll) {
  cur = Math.max(1, Math.min(turns.length, n));
  document.querySelectorAll(".ritem").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.turn === cur)));
  document.querySelectorAll(".turn").forEach((s) => s.setAttribute("aria-current", String(s.id === `turn-${cur}`)));
  if (scroll) document.getElementById(`turn-${cur}`).scrollIntoView({ behavior: "smooth", block: "start" });
}
const order = () => [...main.querySelectorAll(".sel[data-sel]")];
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest("input, textarea") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    const list = order(), i = list.findIndex((n) => n.dataset.sel === selKey);
    const n = list[Math.max(0, Math.min(list.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)))];
    if (n) { ev.preventDefault(); select(n.dataset.sel, true); }
  } else if (ev.key === "ArrowRight") { pane.focus(); }
  else if (ev.key === "j" || ev.key === "k") { markTurn(cur + (ev.key === "j" ? 1 : -1), true); }
  else if (ev.key === "e") { const f = [...G.tools.values()].find((x) => !x.ok); if (f) select(`tool:${f.id}`, true); }
});
markTurn(1, false);
select(`tool:${turns[0].tools[0].id}`);
G.themeInit();
</script>
</body>
