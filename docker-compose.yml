# A limited gateway: the native install (docs/install.md) is the supported path. It sees
# file effects only for folders mounted here at the same path as on the host (ADR 0014),
# and on macOS it needs Docker Desktop's "Enable host networking" (see network_mode).
services:
  gateway:
    image: llm-gateway
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    # Room for shutdown_timeout (10s) plus the capture drain, before Docker kills it.
    stop_grace_period: 30s
    # Loopback only: v1 has no auth, so the gateway refuses any other address (spec
    # 022). On the host's network its default 127.0.0.1 listeners (API 7197, UI 7199,
    # proxies 7198 and 7195) are the host's loopback, so nothing is published and no
    # address is overridden. Native on Linux; Docker Desktop needs "Enable host
    # networking" (spec 022 research D3).
    network_mode: host
    environment:
      # Captures live on the named volume below, so they outlive the container.
      GATEWAY_CAPTURE_DIR: /var/lib/llm-gateway
    volumes:
      - captures:/var/lib/llm-gateway

volumes:
  captures:
