services:
  gateway:
    image: llm-gateway
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    # Room for shutdown_timeout (10s) plus the capture drain, before Docker kills it.
    stop_grace_period: 30s
    # Loopback only on the host: the gateway has no auth yet (spec 000, Do).
    ports:
      - "127.0.0.1:7197:7197"
    environment:
      # A container's own loopback is unreachable from the host, so inside it the
      # gateway listens on every interface; the publish above keeps it local.
      GATEWAY_LISTEN_ADDR: 0.0.0.0:7197
      # Captures live on the named volume below, so they outlive the container.
      GATEWAY_CAPTURE_DIR: /var/lib/llm-gateway
    volumes:
      - captures:/var/lib/llm-gateway

volumes:
  captures:
