# agent-loop configuration — sourced by bash, so keep it KEY="value".
# This is the "repo" layer. A setting is resolved per task, first match wins:
#   /al-implement flags  >  task fields (Model:, Review:, Verify:)  >  plan.md frontmatter
#   >  this file  >  the profile's defaults  >  kit defaults
# See what applies and where it came from:  .claude/scripts/loop.sh config [T002]   (or /al-status --config)

# fast | balanced | strict — the defaults for every commented-out key below.
PROFILE="fast"

# ---------------------------------------------------------------- the repo (required)
# The one command that says "the repo is healthy": tests + lint + build. Exit 0 = green.
# It must not modify files. Required: /al-implement refuses to start while it's empty.
# Get a guess for this repo with: .claude/scripts/loop.sh suggest-verify
#   Node: "npm run lint && npm run build && npm test"
#   Go:   "go vet ./... && go test ./..."
VERIFY_CMD="make verify"

# Optional: lets agents run a subset — loop.sh test ./internal/foo -run TestX
TEST_CMD="go test"                  # e.g. "go test" | "npx vitest run" | "pytest -q"

BASE_BRANCH="main"               # empty = auto (origin/HEAD, then main, master, trunk, develop)
SPECS_DIR="specs"

# ------------------------------------------------- speed / cost (profile defaults shown)
# Uncomment a line to pin it for this repo, whatever the profile.
#                               fast        balanced        strict
# REVIEW="risk"               # branch      risk            every    none|branch|risk|every
# VERIFY="task"               # every-3     task            task     targeted|task|every-N|end|off
# FIX_ROUNDS=2                # 1           2               2        0-3 fix rounds per task
# MUTATION="risk"             # off         risk            every    off|risk|every
# CRITIC="self"               # off         self            agent    spec critique: off|self|agent
# AUTO_APPROVE_TASKS="on"     # on          on              off      /al-approve plan also approves tasks.md
# TRAILERS="on"               # on          on              on       Task:/Feature:/AC: commit trailers
# REVIEW_LINES=150            # 300         150             —        REVIEW=risk: more changed lines → review
# REVIEW_GLOBS="..."          # ""          WATCHED_GLOBS   —        REVIEW=risk: touched path → review
# PLAN_MAX_LINES=200          # 200         200             200      plan.md longer than this → warning
# BATCH_SMALL="off"           # reserved, not built in v0.2: Size: S tasks sharing one implementer

# Models per agent (haiku | sonnet | opus). Per task: a Model: field, or Size: S|M|L via
# SIZE_MODELS. Per run: /al-implement --model T002=haiku,reviewer=opus
# MODEL_PLANNER="opus"        # sonnet      opus            opus
# MODEL_IMPLEMENTER="sonnet"  # sonnet      sonnet          sonnet
# MODEL_REVIEWER="sonnet"     # sonnet      sonnet          opus     task reviews
# MODEL_BRANCH_REVIEWER="opus" # sonnet     opus            opus
# MODEL_QUICK="sonnet"        # sonnet      sonnet          sonnet   /al-quick builder
# MODEL_IMPACT="sonnet"       # sonnet      sonnet          sonnet   /al-change impact analysis
# SIZE_MODELS="S=haiku M=sonnet L=opus"   # fast: S=haiku M=sonnet L=sonnet   strict: S=sonnet M=sonnet L=opus

# ------------------------------------------------------------------ approvals
# The spec sections an approval covers. Editing any other section (Problem, notes, your own
# sections) keeps the spec approved; editing one of these asks for /al-change.
# CONTRACT_SECTIONS="Goal|Non-goals|Acceptance criteria|Edge cases|Constraints"

# ------------------------------------------------------------------ guard rails
QUICK_MAX_ACS=5              # /al-quick refuses bigger briefs: use /al-spec
QUICK_MAX_STEPS=5

# No agent may change these (hard deny in guard.sh and in post-task).
PROTECTED_GLOBS=".githooks/* .github/workflows/*"

# Agents may change these, but the reviewer is shown every change to them
# (the usual way to "make it pass" is to weaken a check).
WATCHED_GLOBS="Makefile go.mod go.sum package.json package-lock.json pnpm-lock.yaml .golangci.yml .golangci.yaml .eslintrc* eslint.config.* tsconfig*.json"

# What counts as a test file (a task that names tests must touch one of these).
TEST_GLOBS="*_test.go *.test.* *.spec.* test_*.py *_test.py tests/* test/* */tests/* */test/* */__tests__/*"

# Extra read-only commands the reviewer/planner may run, as |-separated prefixes.
READONLY_EXTRA_CMDS="go list|go doc|go vet"       # e.g. "go list|go doc|go vet|npm ls"
