# Gateway configuration. Copy to config.yaml (ignored by git) and edit.
# Every key is optional and shown at its default. Precedence: defaults < this file
# < env. Secrets never go here; they only ever come from env vars (ADR 0002).

# Address to listen on, as host:port. Loopback only by default: the gateway has no
# auth yet. An empty host (":7197") is rejected; write 0.0.0.0 or [::] to listen on
# every interface.
# Env: GATEWAY_LISTEN_ADDR
listen_addr: 127.0.0.1:7197

# One of debug, info, warn, error.
# Env: GATEWAY_LOG_LEVEL
log_level: info

# How long shutdown waits for in-flight requests, so streams can finish. Go duration
# syntax; must be > 0. A second signal still stops the gateway at once.
# Env: GATEWAY_SHUTDOWN_TIMEOUT
shutdown_timeout: 10m

# One block per upstream, named after its adapter. An unknown name or key is an error.
# There is no timeout on a request as a whole: streams run as long as upstream sends.
upstreams:
  anthropic:
    # Where requests are forwarded. A path is joined in front of the request's path.
    # Env: GATEWAY_UPSTREAMS_ANTHROPIC_BASE_URL
    base_url: https://api.anthropic.com

    # How long to wait to connect (DNS and TCP). Go duration syntax; must be > 0.
    # Env: GATEWAY_UPSTREAMS_ANTHROPIC_CONNECT_TIMEOUT
    connect_timeout: 10s

    # How long to wait for the TLS handshake. Go duration syntax; must be > 0.
    # Env: GATEWAY_UPSTREAMS_ANTHROPIC_TLS_HANDSHAKE_TIMEOUT
    tls_handshake_timeout: 10s

    # How long to wait for upstream's response headers after the request is sent. Go
    # duration syntax; must be > 0.
    # Env: GATEWAY_UPSTREAMS_ANTHROPIC_RESPONSE_HEADER_TIMEOUT
    response_header_timeout: 10m

# Capture: every proxied exchange is copied on the side, redacted of auth headers and
# stored. Capture never blocks or fails a request. Sizes and counts must be > 0.
capture:
  # false means no copy, no queue and no store: the gateway only proxies.
  # Env: GATEWAY_CAPTURE_ENABLED
  enabled: true

  # Where the store lives. Must be an absolute path. The default is
  # $XDG_DATA_HOME/llm-gateway, else ~/.local/share/llm-gateway.
  # Env: GATEWAY_CAPTURE_DIR
  # dir: /home/you/.local/share/llm-gateway

  # How many finished exchanges may wait to be stored. When it is full, an exchange
  # is dropped and logged, never waited for.
  # Env: GATEWAY_CAPTURE_QUEUE_SIZE
  queue_size: 256

  # How many goroutines store and parse queued exchanges.
  # Env: GATEWAY_CAPTURE_WORKERS
  workers: 2

  # The most bytes kept of each request or response body (32 MiB). Past it the copy
  # stops and the exchange is flagged truncated; forwarding is unaffected.
  # Env: GATEWAY_CAPTURE_MAX_BODY_BYTES
  max_body_bytes: 33554432

  # The memory shared by in-flight copies and queued exchanges (256 MiB). An exchange
  # that would cross it is dropped and logged; forwarding is unaffected.
  # Env: GATEWAY_CAPTURE_MEMORY_LIMIT
  memory_limit: 268435456

# Harness hooks: the events a client's lifecycle hooks send to the gateway's ingest route.
# They have their own queue and memory budget, apart from capture's, so a hook burst
# does not drop LLM captures. Sizes and counts must be > 0.
hooks:
  # How many hook events may wait to be stored. When it is full, an event is dropped,
  # counted and logged, and the hook still gets a 200.
  # Env: GATEWAY_HOOKS_QUEUE_SIZE
  queue_size: 256

  # How many goroutines store queued hook events.
  # Env: GATEWAY_HOOKS_WORKERS
  workers: 1

  # The memory the queued hook bodies may hold (32 MiB). An event that would cross it is
  # dropped and counted; the hook still gets a 200.
  # Env: GATEWAY_HOOKS_MEMORY_LIMIT
  memory_limit: 33554432

# The web UI: a read-only page on its own listener. Loopback only, with no auth: the
# address must be 127.0.0.0/8, ::1 or localhost, and differ from listen_addr.
ui:
  # false means no UI listener and nothing logged about the UI.
  # Env: GATEWAY_UI_ENABLED
  enabled: true

  # Address to listen on, as host:port. Loopback only; an error otherwise.
  # Env: GATEWAY_UI_LISTEN_ADDR
  listen_addr: 127.0.0.1:7199

# Rate limiting: per gateway key, requests and tokens per minute, counted on model calls
# only (POST /v1/messages for Anthropic). Off by default; when off no key is required.
# Clients send their key in the x-gateway-key header (see docs/clients/claude-code.md).
# A window is a fixed 60-second interval aligned to the wall clock. Tokens are input +
# cache-write + output; cache-read is not counted. Over a limit the client gets a 429
# with retry-after and the protocol's error envelope.
# Known limits of the v1 limiter (ADR 0008): a burst of up to 2x rpm is possible across a
# window edge; a restart resets every count to 0; several gateway instances each count
# separately, so the effective limit is up to N times the configured one.
ratelimit:
  # Env: GATEWAY_RATELIMIT_ENABLED
  enabled: false

  # The only strategy so far: an in-memory fixed window (ADR 0008). Redis is deferred.
  # Env: GATEWAY_RATELIMIT_STRATEGY
  strategy: fixed_window_memory

  # One block per gateway key (file only). The key is matched exactly as sent. rpm and
  # tpm are integers >= 0; 0 or omitted means no limit on that axis. Enabling with no
  # keys is an error.
  # keys:
  #   alice:
  #     rpm: 60
  #     tpm: 100000

# Effects (spec 014): what a session did beside the model calls. Files that changed in the
# session's folders, seen at checkpoints run on each stored hook event; files Claude's own
# read tools looked at; and network connections made through the gateway's forward proxy.
# They need the gateway on the host, not in Docker (ADR 0014).
effects:
  # false means no checkpoints, no read effects and no proxy listeners.
  # Env: GATEWAY_EFFECTS_ENABLED
  enabled: true

  files:
    # false turns file checkpoints off; read effects stay on.
    # Env: GATEWAY_EFFECTS_FILES_ENABLED
    enabled: true

    # Absolute folders watched for every session, beside the session's own starting
    # folder, the extra folders its client's settings list and the folders learned from
    # its tools. The home folder, / and temp folders are never watched.
    # Env: GATEWAY_EFFECTS_FILES_EXTRA_DIRS (comma-separated)
    extra_dirs: []

    # Names matched against each part of a path (folders and file names); a match is
    # skipped. .env is left out on purpose so changes to .env files are tracked; add it
    # here to stop that.
    # Env: GATEWAY_EFFECTS_FILES_IGNORE (comma-separated)
    ignore: [.git, node_modules, dist, build, target, .venv, venv, __pycache__, .next, .cache]

    # A changed text file up to this size (256 KiB) gets a copy of its new content, so a
    # diff can be shown. Copies are stored as-is, secrets included (ADR 0005).
    # Env: GATEWAY_EFFECTS_FILES_MAX_COPY_BYTES
    max_copy_bytes: 262144

    # How long each git call of a checkpoint may take. Go duration syntax; must be > 0.
    # Env: GATEWAY_EFFECTS_FILES_GIT_TIMEOUT
    git_timeout: 10s

    # A session's saved snapshot is deleted at session end or after this long without a
    # hook event (7 days); a later checkpoint then starts a new baseline.
    # Env: GATEWAY_EFFECTS_FILES_SNAPSHOT_RETENTION
    snapshot_retention: 168h

  network:
    # false means no proxy listeners; `gateway hooks print` then prints the hooks only.
    # Env: GATEWAY_EFFECTS_NETWORK_ENABLED
    enabled: true

    # The HTTP forward proxy (CONNECT and plain http://). Loopback only, and distinct
    # from every other listener. HTTPS is never decrypted: host, port, bytes and timing.
    # Env: GATEWAY_EFFECTS_NETWORK_HTTP_PROXY_ADDR
    http_proxy_addr: 127.0.0.1:7198

    # The SOCKS5 proxy (no auth, CONNECT only). Loopback only; "" in this file turns it
    # off.
    # Env: GATEWAY_EFFECTS_NETWORK_SOCKS_PROXY_ADDR
    socks_proxy_addr: 127.0.0.1:7195

    # true: `gateway hooks print` adds a sandbox block pointing Claude Code's sandbox at
    # the proxy ports, so every Bash command's traffic goes through them. Off by default:
    # the sandbox is optional and Claude Code's Linux sandbox is broken on some systems
    # (docs/clients/claude-code.md §6).
    # Env: GATEWAY_EFFECTS_NETWORK_SANDBOX
    sandbox: false

    # A connection is linked to the one session with a hook event this recent and no
    # session end; with none or more than one it is stored unassigned.
    # Env: GATEWAY_EFFECTS_NETWORK_ACTIVE_WINDOW
    active_window: 10m

  # How each effect is linked to the tool call that most likely caused it (spec 015).
  attribution:
    # How far each tool call's span is widened at both ends. Claude Code sends its hooks
    # asynchronously, so a hook can reach the gateway after its tool started or ended.
    # 0 to 5s.
    # Env: GATEWAY_EFFECTS_ATTRIBUTION_SKEW
    skew: 250ms
