# Throwaway macOS bench for spec 036. Lives only on chore/036-macos-bench; never merged.
# Round 3: after-fix only, six rounds of 500, go test -json so each failure line has a time.
name: bench-036

on:
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    name: bench (after-fix-5eb96f6 round ${{ matrix.round }})
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the code under test
        run: git checkout --detach 5eb96f62bc21a218713a3764859a68e4bc592ee4 && git log --oneline -1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Bench
        run: |
          go version
          set +e
          go test -json -race -v -run '^TestRun_ClientDisconnectMidStreamRecordsSeenTokens$' \
            -count=500 -timeout 8m ./cmd/gateway > bench.json 2>&1
          rc=$?
          pass=$(jq -r 'select(.Action=="pass" and .Test!=null) | .Test' bench.json 2>/dev/null | wc -l)
          fail=$(jq -r 'select(.Action=="fail" and .Test!=null) | .Test' bench.json 2>/dev/null | wc -l)
          echo "exit=$rc pass=$pass fail=$fail timeout=$(grep -c 'test timed out' bench.json) watchdog=$(grep -c 'watchdog:' bench.json)"
          echo "::group::failure lines with times"
          jq -r 'select(.Output!=null) | select(.Output|test("_test.go:[0-9]+:|--- FAIL|panic|watchdog")) | "\(.Time) \(.Output|rtrimstr("\n"))"' bench.json 2>/dev/null | head -200
          echo "::endgroup::"
          exit $rc
