# Throwaway macOS bench for spec 036. Lives only on chore/036-macos-bench; never merged.
# Round 2: after-fix only, three rounds, printing every failure in full.
name: bench-036

on:
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    name: bench (after-fix-5eb96f6 round ${{ matrix.round }})
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the code under test
        run: git checkout --detach 5eb96f62bc21a218713a3764859a68e4bc592ee4 && git log --oneline -1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Bench
        run: |
          go version
          set +e
          go test -race -v -run '^TestRun_ClientDisconnectMidStreamRecordsSeenTokens$' \
            -count=200 -timeout 5m ./cmd/gateway > bench.log 2>&1
          rc=$?
          echo "exit=$rc pass=$(grep -c -- '--- PASS' bench.log) fail=$(grep -c -- '--- FAIL' bench.log) timeout=$(grep -c 'test timed out' bench.log) watchdog=$(grep -c 'watchdog:' bench.log)"
          echo "::group::failures"
          grep -n -B3 -A40 -- '--- FAIL' bench.log
          echo "::endgroup::"
          tail -20 bench.log
          exit $rc
